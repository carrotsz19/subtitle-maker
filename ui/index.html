/* ---------------------------------------------------------------------
   Actions
--------------------------------------------------------------------- */
function bind(root) {
  root.querySelectorAll("[data-act]").forEach(el => {
    const handler = ACTIONS[el.dataset.act];
    if (!handler) return;
    if (el.tagName === "DETAILS") { el.addEventListener("toggle", () => handler(el)); return; }
    el.onclick = e => { e.stopPropagation(); handler(el); };
    if (el.getAttribute("role") === "button" || el.getAttribute("role") === "radio")
      el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); handler(el); } };
  });
  if (S.review) bindReview(root);
  const hot = $("#hotwords", root);
  if (hot) hot.onchange = async () => { S.info.settings = await api().save_prefs({ hotwords: hot.value.trim() }); toast("Saved."); };
  const wizCode = $("#wiz-code", root);
  if (wizCode) wizCode.oninput = () => { S.setup.language = wizCode.value.trim().toLowerCase() || "other"; };
  const code = $("#lang-code", root);
  if (code) code.oninput = () => { S.draft.language = code.value.trim().toLowerCase() || "other"; updateSave(); };
}

function updateSave() {
  const b = $('[data-act="save"]');
  if (b) b.disabled = S.info.configured && S.draft.level === S.info.settings.level && S.draft.language === S.info.settings.language;
}

const ACTIONS = {
  "rv-play": async el => {
    const c = S.review.cues[+el.dataset.i];
    document.querySelectorAll(".rv-row.playing").forEach(x => x.classList.remove("playing"));
    el.closest(".rv-row").classList.add("playing");
    if (S.review.mode !== "file") return api().review_clip(+el.dataset.i, c.start, c.end);
    if (!S.review.video) { el.closest(".rv-row").classList.remove("playing"); return toast("There's no video with the same name next to this file, so there's nothing to play.", true); }
    const data = await api().edit_clip(c.start, c.end);
    if (!data) { el.closest(".rv-row").classList.remove("playing"); return toast("Couldn't play that part of the video.", true); }
    app.onEvent({ type: "clip", data });
  },
  "rv-timing": el => { const i = +el.dataset.i; S.review.timing = S.review.timing === i ? null : i; render(); },
  "rv-nudge": el => {
    const i = +el.dataset.i, key = el.dataset.k, c = S.review.cues[i];
    rvSetTime(i, key, c[key] + parseFloat(el.dataset.d));
    render();
  },
  "rv-split": el => {
    const r = S.review, i = +el.dataset.i, c = r.cues[i], text = c.text.trim();
    let at = r.caret && r.caret.i === i ? r.caret.pos : -1;
    if (at <= 0 || at >= text.length) {
      // No cursor in this line: the space nearest the middle
      const spaces = [...text.matchAll(/ /g)].map(m => m.index);
      if (!spaces.length) return toast("A single word can't be split.", true);
      at = spaces.reduce((best, x) => Math.abs(x - text.length / 2) < Math.abs(best - text.length / 2) ? x : best);
    }
    const left = text.slice(0, at).trim(), right = text.slice(at).trim();
    if (!left || !right) return toast("Put the cursor where the line should be split.", true);
    // The time is shared out by length, which is close to how long each part takes to say
    const cut = Math.round((c.start + (c.end - c.start) * left.length / (left.length + right.length)) * 100) / 100;
    r.cues.splice(i, 1, { ...c, text: left, end: cut }, { ...c, text: right, start: cut });
    r.timing = null; r.caret = null;
    render();
  },
  "rv-merge": el => {
    const r = S.review, i = +el.dataset.i, c = r.cues[i], next = r.cues[i + 1];
    if (!next || next.gone) return;
    if (r.hasNames && next.speaker !== c.speaker) toast(`Joined into ${r.names[c.speaker] || "the first speaker"}'s line.`);
    r.cues.splice(i, 2, { ...c, text: `${c.text.trim()} ${next.text.trim()}`, end: next.end });
    r.timing = null; r.caret = null;
    render();
  },
  "rv-del": el => { const c = S.review.cues[+el.dataset.i]; c.gone = !c.gone; render(); },
  "rv-replace": async () => {
    const find = $("#rv-find").value, repl = $("#rv-repl").value;
    if (!find) return;
    const re = new RegExp(find.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    let n = 0;
    S.review.cues.forEach(c => { if (c.gone) return; c.text = c.text.replace(re, () => { n++; return repl; }); });
    const remember = $("#rv-remember") && $("#rv-remember").checked;
    render();
    if (remember) {
      S.info.settings = await api().add_fix(find, repl);
      toast(`${n ? `Replaced ${n} time${n > 1 ? "s" : ""}. ` : ""}From now on every video gets "${find}" → "${repl || "(removed)"}".`);
    } else toast(n ? `Replaced ${n} time${n > 1 ? "s" : ""}.` : `"${find}" isn't in any line.`, !n);
  },
  "rv-save": async () => {
    const r = S.review;
    if (r.mode === "file") {
      const res = await api().save_srt(r.cues.filter(c => !c.gone).map(({ start, end, text }) => ({ start, end, text })));
      if (res.error) return toast(res.error, true);
      S.review = null;
      render();
      return toast(`Saved ${res.count} lines to ${baseName(res.path)}.${res.backup ? " The old version is backed up." : ""}`);
    }
    api().review_done(r.cues.filter(c => !c.gone).map(({ start, end, text, speaker }) => ({ start, end, text, speaker })), r.names);
    S.review = null;
    S.run.stage = "Saving";
    render();
  },
  "rv-discard": () => S.review.mode === "file"
    ? confirmBox("Close without saving?", "Any changes you made to this file are lost. The file stays as it was.", "Close",
      () => { S.review = null; api().close_srt(); render(); })
    : confirmBox("Discard these subtitles?", "Nothing for this video is saved. The next video in the queue starts.", "Discard",
    () => { S.review = null; api().cancel(); }),
  pref: async el => {
    const key = el.dataset.k;
    S.info.settings = await api().save_prefs({ [key]: JSON.parse(el.dataset.v) });
    if (key === "theme") applyTheme();
    render();
  },
  "reset-prefs": () => confirmBox("Reset these settings?", "Subtitle style, speakers, accuracy, when it's done and appearance go back to how they started. Quality, language and where subtitles go stay as they are.",
    "Reset", async () => { S.info.settings = await api().reset_prefs(); applyTheme(); render(); toast("Settings reset."); }),
  "out-here": async () => { S.info.settings = await api().set_output_dir(null); render(); },
  "out-folder": async () => {
    const dir = await api().choose_folder();
    if (dir) { S.info.settings = await api().set_output_dir(dir); render(); toast("New subtitles will be saved there."); }
  },
  "reveal-dir": el => api().reveal(el.dataset.path),
  "goto-make": () => go("make"),
  again: el => app.addFiles([el.dataset.path]),
  retry: el => { app.addFiles([el.dataset.path]); next(); },
  forget: async el => { S.history = await api().remove_history(el.dataset.id); render(); },
  "clear-history": () => confirmBox("Clear the whole history?", "Only the list is cleared. Your subtitle files stay where they are.",
    "Clear history", async () => { S.history = await api().clear_history(); render(); }),
  "open-update": () => openUpdate(),
  "check-update": () => checkUpdate(false),
  channel: async el => {
    if (el.dataset.v === (S.info.settings.channel || "main")) return;
    S.info.settings = await api().set_channel(el.dataset.v);

  "wiz-next": () => {

    async () => { S.voicesKnown = await api().forget_voice(el.dataset.name); render(); }),
  "forget-all-voices": () => confirmBox("Forget everyone's voice?", "Everyone will be asked about again in their next video.", "Forget everyone",
    async () => { S.voicesKnown = await api().forget_all_voices(); render(); }),
  "choose-folder": async () => {

  "copy-error": async el => {

    copyText(await api().error_details(q.path, q.error || "It stopped unexpectedly."));
  },
  "delete-model": el => confirmBox(`Delete the ${el.dataset.name} model?`, `Frees ${el.dataset.gb} GB. It downloads again if you pick that quality later.`, "Delete",
    async () => {
      const left = await api().delete_model(el.dataset.model);
      if (!left) return toast("Can't delete it while it's in use.", true);
      S.models = left; S.info.models = await api().models_status(); render(); toast("Deleted.");
    }),
  remove: el => { S.queue = S.queue.filter(q => !(q.path === el.dataset.path && q.status === "waiting")); render(); },
  // Remembered for next time: most people make the same kind of video again
  multi: el => { S.multi = el.dataset.v === "1"; render(); api().save_prefs({ multi: S.multi }); },
  people: el => { S.people = +el.dataset.v; render(); api().save_prefs({ people: S.people }); },
  voices: async () => { S.info.voices = await api().open_voices(); },
  "goto-settings": () => go("settings"),
  start: () => next(),
  cancel: () => { S.cancelAll = true; api().cancel(); },
  reveal: el => api().reveal(el.dataset.path),
  "error-log": () => api().open_error_log(),
  clear: () => { S.queue = S.queue.filter(q => q.status === "waiting"); render(); },
  log: el => { if (S.run) S.run.logOpen = el.open; },
  level: el => { S.draft.level = el.dataset.v; render(); },
  lang: el => { const v = el.dataset.v; S.draft.language = v === "null" ? null : v; render(); if (v === "other") $("#lang-code").focus(); },
  save: async () => {
    const lang = S.draft.language === "other" ? null : S.draft.language, level = S.draft.level;
    S.info.settings = await api().save_settings(level, lang);
    S.info.configured = true;
    S.draft = null;
    // Already downloaded: nothing to fetch, switching is instant
    if (neededFor(level).every(i => i.have)) { toast("Saved. The next video uses it."); render(); return; }
    startPrepare(level, (ok, error) => {
      toast(ok ? "Saved and downloaded. The next video uses it." : (error || "The download didn't finish.") + " Save again to retry.", !ok);
      render();
    });
    render();
  },
};

/* Starts the next waiting file, if nothing is running. */
function next() {
  if (S.run) return;
  const item = S.queue.find(q => q.status === "waiting");
  if (!item) {
    // The whole queue is done: show where the subtitles went, if Settings says to
    const first = (S.batch || []).find(Boolean);
    if (first && S.info.settings.open_folder) api().reveal(first);
    const done = S.queue.filter(q => q.status === "done").length, failed = S.queue.filter(q => q.status === "failed").length;
    if (done + failed && (S.batch || []).length + failed) api().queue_finished(done, failed);
    S.batch = [];
    render();
    return;
  }
  item.status = "working";
  const potato = S.info.settings.level === "potato";
  const speakers = S.multi && !potato ? S.people : null;
  S.run = { kind: "make", item, done: 0, total: 0, stage: "Loading the model", speakers: null, res: null, log: [], startedAt: null };
  api().start(item.path, speakers);
  if (S.view === "make") render();
  else renderSide();
}

/* ---------------------------------------------------------------------
   Called from app.py
--------------------------------------------------------------------- */
const app = {
  async openSrt(path) {
    if (!S.info) { S.pendingSrt = path; return; }  // dropped on the icon: once the page is ready
    if (S.run) return toast("Wait for the current video to finish first.", true);
    if (S.review) return toast("Save or close the lines you're checking first.", true);
    const r = await api().open_srt(path);
    if (r.error) return toast(r.error, true);
    S.review = { mode: "file", file: r.file, path: r.path, video: r.video, style: "none", max_chars: r.max_chars, max_lines: r.max_lines,
      names: {}, hasNames: false, cues: r.cues };
    if (S.view !== "make") go("make"); else render(true);
  },

  addFiles(paths) {
    let added = 0;
    for (const p of paths || []) {
      if (S.queue.some(q => q.path === p && (q.status === "waiting" || q.status === "working"))) continue;
      S.queue.push({ path: p, name: baseName(p), status: "waiting" });
      added++;
    }
    if (!added) return;
    // Mark the ones that already have subtitles (the new file won't replace them)
    const fresh = S.queue.filter(q => q.status === "waiting" && q.has_srt === undefined);
    api().queue_info(fresh.map(q => q.path)).then(info => {
      fresh.forEach(q => { q.has_srt = !!(info[q.path] && info[q.path].has_srt); });
      if (S.view === "make" && !S.review && fresh.some(q => q.has_srt)) render();
    });
    // A finished batch makes way for the new one
    if (!S.run) S.queue = S.queue.filter(q => q.status === "waiting");
    // Start loading the speech model while you pick the options, so the first video starts sooner
    if (!S.run) api().warm();
    if (S.view !== "make") go("make"); else render();
  },

  onEvent(ev) {
    if (ev.type === "update_progress") {
      const u = S.update;
      u.progress = u.progress || {};
      if (ev.step === "download" || ev.step === "install") { u.current = ev.step; u.progress[ev.step] = { done: ev.done, total: ev.total }; }
      renderUpdateSheet();
      return;
    }
    if (ev.type === "update_done") {
      Object.assign(S.update, ev.error ? { state: "error", error: ev.error } : { state: "installed", current: "done", packages: ev.packages });
      if (!S.update.sheet && !ev.error) toast("Updated. Restart the window to use it.");
      renderUpdateSheet();
      render();  // no video can be running during an update, so a full redraw is safe
      return;
    }
    const r = S.run;
    if (!r) return;
    switch (ev.type) {
      case "progress":
        if (ev.stage === "Transcribing" && !r.startedAt && ev.done === 0) r.startedAt = Date.now();
        // Speaker detection just finished: the processor is freed up, so measure the speed afresh
        if (r.speakers != null && r.speakers < 1 && ev.speakers === 1) r.rateFrom = Date.now();
        if (ev.done !== r.done) (r.points = r.points || []).push({ t: Date.now(), done: ev.done });
        if (r.points && r.points.length > 400) r.points.splice(0, 200);
        Object.assign(r, { done: ev.done, total: ev.total, stage: ev.stage, speakers: ev.speakers, expect: ev.expect });
        break;
      case "resources": r.res = ev; break;
      case "download":
        if (r.kind === "make") { r.stage = `Downloading ${ev.label}${ev.total ? ` · ${Math.round(ev.done)} of ${Math.round(ev.total)} MB` : ""}`; break; }
        r.downloads[ev.item] = { done: ev.done, total: ev.total, finished: ev.total && ev.done >= ev.total };
        { const box = $("#downloads"); if (box) box.innerHTML = downloadRows(r.level); }
        return;
      case "log":
        r.log.push(ev.text);
        if (/^Loading/.test(ev.text)) r.stage = "Loading the model";
        if (/^Speaker detection on/.test(ev.text)) r.stage = "Starting speaker detection";
        break;
      case "ask_speaker": showAsk(ev); return;
      case "review": {
        const names = Object.keys(ev.names).length ? ev.names : null;
        S.review = { file: ev.file, style: ev.style, max_chars: ev.max_chars, max_lines: ev.max_lines,
          names: names || {}, hasNames: !!names, cues: ev.cues.map(c => ({ ...c })) };
        if (S.view === "make") render(true); else toast("The subtitles are ready to check.");
        return;
      }
      case "clip": {
        if (S.player) S.player.pause();
        S.player = new Audio(ev.data);
        S.player.onended = () => document.querySelectorAll(".rv-row.playing").forEach(x => x.classList.remove("playing"));
        S.player.play().catch(() => {});
        return;
      }
      case "done":
        if (r.item) { r.item.status = "done"; r.item.files = ev.files; (S.batch = S.batch || []).push(ev.files[0] && ev.files[0].path); }
        break;
      case "error":
        if (r.item) { r.item.status = "failed"; r.item.error = ev.message; r.item.log = ev.log; }
        else if (r.after) r.error = ev.message;
        else toast(ev.message, true);
        break;
      case "exit": {
        if (r.item && r.item.status === "working") r.item.status = ev.cancelled ? "cancelled" : "failed";
        if (r.kind === "prepare") {
          S.run = null;
          S.models = null;
          api().models_status().then(m => { S.info.models = m; if (r.after) r.after(!ev.code, r.error); else render(); });
          return;
        }
        if (r.kind === "make") { S.history = null; S.voicesKnown = null; if (S.view === "history") loadHistory(); }
        S.run = null;
        S.review = null;
        $("#dialog-root").innerHTML = "";
        S.ask = null;
        if (ev.cancelled || S.cancelAll) {
          S.queue = S.queue.filter(q => q.status !== "cancelled");
          S.cancelAll = false;
          render();
          toast("Stopped.");
          return;
        }
        next();
        return;
      }
    }
    if (S.view === "make" && r.kind === "make") patchRunning();

  },
};

/* Re-render the running card without re-binding the whole page. */
function patchRunning() {
  const card = $("#running");
  if (!card) return render();
  const tmp = document.createElement("div");
  tmp.innerHTML = viewRunning();
  const fresh = tmp.firstElementChild;
  // The main bar slides back and forth until the length is known; stop that once it is
  card.querySelector(".bar").classList.toggle("indeterminate", !S.run.total);
  // Keep the log's open state and scroll, and animate bars from their current widths
  card.querySelectorAll(".bar > i").forEach((old, i) => {
    const nu = fresh.querySelectorAll(".bar > i")[i];
    if (nu) old.style.width = nu.style.width;
  });
  ["#run-pct", "#run-stage", "#run-spk"].forEach(sel => { const a = $(sel, card), b = $(sel, fresh); if (a && b) a.innerHTML = b.innerHTML; });
  const oldMeters = $(".meters", card), newMeters = $(".meters", fresh);
  if (newMeters && !oldMeters) $("details", card).before(newMeters);
  else if (oldMeters && newMeters) oldMeters.querySelectorAll(".meter").forEach((m, i) => {
    const n = newMeters.querySelectorAll(".meter")[i]; if (!n) return;
    m.querySelector("b").textContent = n.querySelector("b").textContent;
    m.className = n.className;
  });
  const spk = S.run.speakers != null;
  if (spk !== !!card.querySelector(".bar.ok")) return render();
  const log = $("#run-log", card);
  const stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  log.textContent = S.run.log.slice(-40).join("\n");
  if (stick) log.scrollTop = log.scrollHeight;
}

/* Drag highlighting. app.py receives the drop itself, because only it can see full file paths. */
let dragDepth = 0;
document.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
document.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", () => { dragDepth = 0; document.body.classList.remove("dragging"); });

/* ---------------------------------------------------------------------
   Starting up: the loader says what's happening, and speaks up if it's slow or broken
--------------------------------------------------------------------- */
const BOOT = { stage: "connecting the window to Subtitle Maker", done: false };

function loaderSay(title, text) {
  $("#loader-title").textContent = title;
  $("#loader-text").textContent = text;
}

function loaderProblem(text, detail) {
  if (BOOT.done) return;
  const box = $("#loader");
  box.classList.add("problem");
  loaderSay("Subtitle Maker didn't start properly", text + (detail ? "\n\n" + detail : ""));
  const hasApi = !!(window.pywebview && window.pywebview.api);
  $("#loader-actions").innerHTML = `<button class="btn" id="ld-retry">Try again</button>
    ${hasApi ? `<button class="btn sec" id="ld-restart">Restart</button><button class="btn ghost" id="ld-log">Open the startup log</button>` : ""}`;
  $("#ld-retry").onclick = () => location.reload();
  if (hasApi) {
    $("#ld-restart").onclick = () => api().restart_app();
    $("#ld-log").onclick = () => api().open_startup_log();
  }
}

setTimeout(() => { if (!BOOT.done) loaderSay("Still starting…", "This can take a little longer the first time after installing or updating."); }, 8000);
setTimeout(() => loaderProblem(`It got stuck ${BOOT.stage}.`,
  "Try again usually fixes it. If it keeps happening, restart your PC, or run Setup.bat to repair."), 25000);

function loaderDone() {
  BOOT.done = true;
  const box = $("#loader");
  box.classList.add("gone");
  setTimeout(() => box.remove(), 400);
}

async function boot() {
  BOOT.stage = "loading your settings";
  try {
    S.info = await api().init();
  } catch (e) {
    return loaderProblem("It couldn't load your settings.", String(e && e.message || e));
  }
  BOOT.stage = "drawing the window";
  try { await startApp(); } catch (e) { return loaderProblem("Something went wrong while opening.", String(e && e.message || e)); }
  loaderDone();
}

async function startApp() {
  applyTheme();
  if (S.info.unfinished && S.info.unfinished.length && S.info.mode !== "setup") S.unfinished = S.info.unfinished;
  S.multi = !!S.info.settings.multi;
  S.people = S.info.settings.people || 0;
  if (S.info.mode === "setup" || !S.info.configured) startSetup();
  go("make");
  requestAnimationFrame(() => api().page_ready());  // for startup.log
  if (S.pendingSrt) { app.openSrt(S.pendingSrt); S.pendingSrt = null; }
  if (S.info.mode === "update") openUpdate();  // opened by Update.bat
  // Quietly, and a few seconds in so it doesn't slow the start: only a ready update is shown
  // Even with automatic checks off this looks, but then only speaks up for a security update
  else setTimeout(() => checkUpdate(true), 4000);
}
if (window.pywebview && window.pywebview.api) boot();
else window.addEventListener("pywebviewready", boot);
</script>
