<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subtitle Maker</title>
<link rel="icon" href="icon.svg">
<style>
/* =====================================================================
   SUBTITLE MAKER — WINDOW
   Same look as IronLog desktop (veyra/live/desktop.html and
   ui-standard.md): the warm palette, its semantic colour layer, the
   radius scale, the sidebar shell, grouped rows and spring motion.
   No CDNs: system fonts and inline SVG, so it works offline.
===================================================================== */
:root{
  --bg-grouped:#f3f1ec; --bg-elevated:#fff; --fill-secondary:#eceae5;
  --fill-tertiary:rgba(27,26,24,.05); --separator:#dcd8cf;
  --label-primary:#1b1a18; --label-secondary:#5e5a53; --label-tertiary:#6f6a62;
  --tint:#b3492b; --tint-soft:#f1ddd4;
  --positive:#3f6b4a; --positive-soft:#e0ece2;
  --negative:#b3492b; --negative-soft:#f4ddd4;
  --on-tint:#fff;
  /* text and marks on --tint-soft (a pill, a banner, the Resolve callout), and the ring of an
     unpicked radio, an empty meter or a switch that's off: 4.5:1 and 3:1 against what they sit
     on, in both themes. Secondary and tertiary text (--label-*) are 4.5:1 or more too: tertiary
     measured 5.4:1 on white and 4.5:1 on the grey fill (light), 5.0 and 4.6:1 (dark). */
  --tint-ink:#9e3e22; --control:#8a8479;
  --seg-thumb:#fff; --seg-thumb-shadow:0 1px 2px rgba(27,26,24,.12), 0 3px 8px rgba(27,26,24,.07);
  --tint-wash:rgba(179,73,43,.06);
  --elev-1:0 1px 2px rgba(27,26,24,.04), 0 4px 12px rgba(27,26,24,.05);
  --elev-2:0 2px 8px rgba(27,26,24,.05), 0 12px 28px rgba(27,26,24,.09);
  --elev-3:0 0 0 1px rgba(27,26,24,.04), 0 8px 16px rgba(27,26,24,.07), 0 24px 64px rgba(27,26,24,.16);
  --hairline:rgba(27,26,24,.09);

  --bg:var(--bg-grouped); --panel:var(--bg-elevated); --panel-2:var(--fill-secondary);
  --line:var(--separator); --ink:var(--label-primary); --dim:var(--label-secondary); --faint:var(--label-tertiary);
  --accent:var(--tint); --accent-soft:var(--tint-soft); --accent-ink:var(--tint-ink);
  --ok:var(--positive); --ok-soft:var(--positive-soft); --bad:var(--negative); --bad-soft:var(--negative-soft); --bad-ink:var(--tint-ink);  /* (--negative is --tint's colour) */

  --r-control:10px; --r-card:14px; --r-sheet:20px;
  --sidebar:220px;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-standard:cubic-bezier(.25,.1,.25,1);
  /* Motion: things that move are on springs, the way macOS and iOS move them. Each curve below is a
     real damped spring (Apple's response / dampingFraction), sampled into linear() by a small script;
     the -ms value is how long that spring takes to settle to within 0.1%, so it isn't a speed to tune.
     Most of the travel is over in the first third. Hover is not a spring: colours ease in 130 ms.
       snappy  response .30 s, damping .80 (1.5% overshoot): controls, press release, pills, switch knobs
       default response .35 s, damping .85 (0.6%): the sidebar highlight, small moves
       spatial response .42 s, damping .86 (0.5%): dialogs, screens, rows changing place
       bouncy  response .42 s, damping .68 (5.4%): only where it delights (a tick, the drop target lifting)
       pop     response .32 s, damping .55 (12.6%): only a radio's dot, which is so small that a gentler
               spring's overshoot is a fraction of a pixel and can't be seen
     Fades are never on a spring (a spring's S-curve and overshoot are wrong for opacity): they run
     beside it as their own short ease-out. */
  --ease-in:cubic-bezier(.7,0,.84,0);
  --spring-snappy-ms:420ms;
  --spring-snappy:linear(0, 0.006 1.3%, 0.026 2.8%, 0.057 4.3%, 0.097 5.8%, 0.195 8.8%, 0.434 15.3%, 0.539 18.3%, 0.641 21.5%, 0.722 24.5%, 0.792 27.5%, 0.849 30.5%, 0.898 33.8%, 0.936 37%, 0.966 40.5%, 0.989 44.5%, 1.004 48.8%, 1.013 53.8%, 1.015 62.3%, 1);
  --spring-default-ms:460ms;
  --spring-default:linear(0, 0.005 1.3%, 0.023 2.8%, 0.05 4.3%, 0.093 6%, 0.189 9.3%, 0.414 16%, 0.516 19.3%, 0.609 22.5%, 0.69 25.8%, 0.76 29%, 0.817 32.3%, 0.864 35.5%, 0.904 39%, 0.939 43%, 0.966 47.5%, 0.986 52.5%, 0.998 58%, 1.006 71.3%, 1);
  --spring-spatial-ms:540ms;
  --spring-spatial:linear(0, 0.005 1.3%, 0.022 2.8%, 0.054 4.5%, 0.095 6.3%, 0.19 9.5%, 0.408 16.3%, 0.508 19.5%, 0.605 23%, 0.684 26.3%, 0.752 29.5%, 0.809 32.8%, 0.858 36.3%, 0.898 39.8%, 0.934 44%, 0.962 48.5%, 0.981 53.5%, 0.994 59%, 1.002 65.3%, 1.005 73%, 1);
  --spring-bouncy-ms:680ms;
  --spring-bouncy:linear(0, 0.008 1.3%, 0.029 2.5%, 0.061 3.8%, 0.111 5.3%, 0.16 6.5%, 0.225 8%, 0.493 13.8%, 0.604 16.3%, 0.713 19%, 0.798 21.5%, 0.869 24%, 0.932 26.8%, 0.979 29.5%, 1.013 32.3%, 1.032 34.5%, 1.045 37%, 1.052 39.5%, 1.054 42.5%, 1.047 47.8%, 1.013 62.3%, 1.003 70%, 0.997 81.8%, 1);
  --spring-pop-ms:640ms;
  --spring-pop:linear(0, 0.012 1.3%, 0.052 2.8%, 0.128 4.5%, 0.255 6.8%, 0.654 13%, 0.807 15.8%, 0.92 18.3%, 1.007 20.8%, 1.068 23.3%, 1.108 26%, 1.126 29.3%, 1.117 33.3%, 1.014 47.5%, 0.988 54.8%, 0.987 65.3%, 1.002 88.3%, 1);
  color-scheme:light;
}
/* Dark: when Windows is dark (unless Settings says Light), or when Settings says Dark */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg-grouped:#15140f; --bg-elevated:#1e1c17; --fill-secondary:#272420;
    --fill-tertiary:rgba(236,239,231,.06); --separator:#37342c;
    --label-primary:#f2efe8; --label-secondary:#b0aa9d; --label-tertiary:#918b7f;
    --tint:#d9633e; --tint-soft:#3a2a22;
    --positive:#7fae87; --positive-soft:#22302a;
    --negative:#d9633e; --negative-soft:#382720;
    --on-tint:#161310;
    --tint-ink:#e8835e; --control:#7a7366;
    --seg-thumb:#4a453b; --seg-thumb-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 1px 3px rgba(0,0,0,.4);
    --tint-wash:rgba(217,99,62,.09);
    --elev-1:inset 0 1px 0 rgba(255,255,255,.045), 0 1px 2px rgba(0,0,0,.28), 0 4px 12px rgba(0,0,0,.30);
    --elev-2:inset 0 1px 0 rgba(255,255,255,.055), 0 2px 8px rgba(0,0,0,.30), 0 12px 28px rgba(0,0,0,.40);
    --elev-3:inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 1px rgba(0,0,0,.40), 0 8px 16px rgba(0,0,0,.35), 0 24px 64px rgba(0,0,0,.55);
    --hairline:rgba(255,255,255,.07);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg-grouped:#15140f; --bg-elevated:#1e1c17; --fill-secondary:#272420;
    --fill-tertiary:rgba(236,239,231,.06); --separator:#37342c;
    --label-primary:#f2efe8; --label-secondary:#b0aa9d; --label-tertiary:#918b7f;
    --tint:#d9633e; --tint-soft:#3a2a22;
    --positive:#7fae87; --positive-soft:#22302a;
    --negative:#d9633e; --negative-soft:#382720;
    --on-tint:#161310;
    --tint-ink:#e8835e; --control:#7a7366;
    --seg-thumb:#4a453b; --seg-thumb-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 1px 3px rgba(0,0,0,.4);
    --tint-wash:rgba(217,99,62,.09);
    --elev-1:inset 0 1px 0 rgba(255,255,255,.045), 0 1px 2px rgba(0,0,0,.28), 0 4px 12px rgba(0,0,0,.30);
    --elev-2:inset 0 1px 0 rgba(255,255,255,.055), 0 2px 8px rgba(0,0,0,.30), 0 12px 28px rgba(0,0,0,.40);
    --elev-3:inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 1px rgba(0,0,0,.40), 0 8px 16px rgba(0,0,0,.35), 0 24px 64px rgba(0,0,0,.55);
    --hairline:rgba(255,255,255,.07);
    color-scheme:dark;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; }
body{
  background:var(--bg); color:var(--ink); overflow:hidden;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-user-select:none; user-select:none;
}
input, .selectable{ -webkit-user-select:text; user-select:text; }
.mono{ font-variant-numeric:tabular-nums; }
.code{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; }
.hide{ display:none !important; }
.dim{ color:var(--dim); } .faint{ color:var(--faint); }
.sm{ font-size:12.5px; } .xs{ font-size:11.5px; }
.trunc{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row{ display:flex; align-items:center; gap:10px; }
.between{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.grow{ flex:1; min-width:0; }
.right{ text-align:right; }
h1{ font-size:24px; font-weight:800; letter-spacing:-.02em; margin:0; }
h2{ font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); margin:0 0 7px 16px; }
h3{ font-size:17px; font-weight:700; letter-spacing:-.01em; margin:0; }
p{ margin:0; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:var(--line); border-radius:99px; border:2px solid var(--bg); }

/* ---------- shell ---------- */
.shell{ display:grid; grid-template-columns:var(--sidebar) 1fr; height:100vh; }
aside.side{ background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:16px 12px; }
.brand{ display:flex; align-items:center; gap:9px; padding:4px 8px 18px; }
.brand .mark{ width:30px; height:30px; border-radius:8px; overflow:hidden; flex-shrink:0; box-shadow:0 0 0 1px var(--hairline); }
.brand .mark img{ display:block; }
.brand b{ font-size:15px; letter-spacing:-.01em; }
.nav{ position:relative; }
.navbtn{ position:relative; z-index:1; display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0; background:transparent; color:var(--ink); font:inherit; font-weight:600; padding:9px 10px; border-radius:var(--r-control); cursor:pointer; margin-bottom:2px; }
.navbtn:hover{ background:var(--fill-tertiary); }
.navbtn[aria-current="true"]{ color:var(--accent); }
.navbtn[aria-current="true"]:hover{ background:transparent; }
.navbtn svg{ opacity:.8; flex-shrink:0; }
.nav-pill{ position:absolute; left:0; right:0; height:40px; border-radius:var(--r-control); background:var(--accent-soft); transition:transform var(--spring-default-ms) var(--spring-default); }
.navbtn .count{ margin-left:auto; font-size:11px; font-weight:800; min-width:20px; height:20px; padding:0 6px; border-radius:99px; background:var(--accent); color:var(--on-tint); display:flex; align-items:center; justify-content:center; }
.side .spacer{ flex:1; }
.sidecard{ border-radius:var(--r-card); padding:12px; background:var(--panel-2); font-size:12.5px; cursor:pointer; text-align:left; border:0; color:var(--ink); font-family:inherit; width:100%; }
.sidecard:hover{ background:var(--fill-tertiary); box-shadow:inset 0 0 0 1px var(--line); }
.sidecard b{ display:block; font-size:13px; margin-bottom:2px; }
/* the installed version, on every screen; it opens About */
.verbtn{ all:unset; box-sizing:border-box; display:block; width:100%; margin-top:6px; padding:5px 8px; border-radius:8px; text-align:center;
  font-size:11.5px; color:var(--dim); cursor:pointer; font-variant-numeric:tabular-nums;
  transition:color 130ms var(--ease-standard), background-color 130ms var(--ease-standard); }
.verbtn:hover{ color:var(--ink); background:var(--fill-tertiary); }
.verbtn:active{ color:var(--ink); background:var(--fill-secondary); }
.verbtn:empty{ display:none; }
.verbtn:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
main.main{ overflow-y:auto; scrollbar-gutter:stable; padding:26px 30px 48px; }
.inner{ max-width:760px; margin:0 auto; }
/* Quality and the Resolve guide use a big window's width, in columns, instead of one narrow strip */
.inner:has(> .guide), .inner:has(> .settings-page.wide){ max-width:1120px; }
@media (min-width:1600px){ .inner:has(> .guide), .inner:has(> .settings-page.wide){ max-width:1280px; } }
.topbar{ margin-bottom:20px; }
.topbar p{ color:var(--dim); margin-top:3px; }

/* ---------- surfaces ---------- */
.card{ background:var(--panel); border-radius:var(--r-card); padding:18px; box-shadow:var(--elev-1); }
.stack > * + *{ margin-top:16px; }
.block + .block{ margin-top:22px; }
.foot{ font-size:12.5px; color:var(--dim); margin:7px 16px 0; }
.grp{ background:var(--panel); border-radius:var(--r-card); box-shadow:var(--elev-1); overflow:hidden; }
.grp-row{ display:flex; align-items:center; gap:12px; min-height:48px; padding:8px 16px; position:relative; }
.grp-row + .grp-row::before{ content:""; position:absolute; top:0; right:0; left:16px; height:1px; background:var(--hairline); }
.grp-row.has-icon + .grp-row.has-icon::before{ left:58px; }
.grp-row.tap{ cursor:pointer; }
.grp-row.tap:hover{ background:var(--fill-tertiary); }
.grp-row.danger{ color:var(--bad); font-weight:600; justify-content:center; }
/* Settings, iPhone style */
.set-row{ min-height:46px; padding-top:7px; padding-bottom:7px; }
.set-row .row-title{ font-weight:500; }
.set-row .ico{ width:29px; height:29px; border-radius:7px; display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; }
.ico.i-red{ background:#c4532f; } .ico.i-blue{ background:#3d6c9e; } .ico.i-gold{ background:#b8862c; } .ico.i-plum{ background:#86517b; }
.ico.i-green{ background:#3f7a4f; } .ico.i-indigo{ background:#585f9e; } .ico.i-teal{ background:#2f7d7a; } .ico.i-slate{ background:#4d5866; } .ico.i-gray{ background:#857f75; }
.set-row .val{ color:var(--dim); font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:46%; }
.grp-row .chev{ color:var(--faint); flex-shrink:0; margin-left:-2px; }
.badge{ min-width:20px; height:20px; border-radius:10px; background:var(--bad); color:var(--on-tint); font-size:12px; font-weight:700;
  display:inline-flex; align-items:center; justify-content:center; padding:0 6px; }
.set-card{ gap:14px; padding-top:12px; padding-bottom:12px; }
.set-card .app-tile{ border-radius:13px; box-shadow:0 0 0 1px var(--hairline); flex-shrink:0; }
.set-name{ font-size:18px; font-weight:700; letter-spacing:-.01em; }
.grp-row.center-row{ color:var(--accent); font-weight:600; justify-content:center; }
.back{ display:inline-flex; align-items:center; gap:6px; color:var(--accent); font:inherit; font-size:15px; font-weight:500;
  background:none; border:0; padding:4px 8px 4px 0; margin:-4px 0 8px -2px; cursor:pointer; border-radius:8px; }
.back:hover{ opacity:.78; }
.back:active{ opacity:.6; }
.btn.dan{ background:var(--bad); color:var(--on-tint); }
.checkrow{ display:flex; align-items:flex-start; gap:10px; cursor:pointer; font-size:14px; }
.checkrow input{ width:18px; height:18px; margin:2px 0 0; accent-color:var(--accent); flex-shrink:0; }
.list{ margin:0; padding-left:18px; } .list li + li{ margin-top:4px; }
.row-title{ font-size:14px; font-weight:500; }
.row-sub{ font-size:12.5px; color:var(--dim); }
.tile-icon{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--panel-2); color:var(--dim); }
.grp.inset .tile-icon{ background:var(--panel); }
.tile-icon.t-accent{ background:var(--accent-soft); color:var(--accent); }
.tile-icon.t-ok{ background:var(--ok-soft); color:var(--ok); }
.tile-icon.t-bad{ background:var(--bad-soft); color:var(--bad); }
.pill{ font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:99px; background:var(--panel-2); color:var(--dim); white-space:nowrap; letter-spacing:.02em; }
.pill.accent{ background:var(--accent-soft); color:var(--accent-ink); }
.pill.ok{ background:var(--ok-soft); color:var(--ok); }
.pill.bad{ background:var(--bad-soft); color:var(--bad-ink); }
.banner{ background:var(--accent-soft); color:var(--accent-ink); border-radius:var(--r-control); padding:11px 14px; font-size:13px; font-weight:600; }
.banner.bad{ background:var(--bad-soft); color:var(--bad-ink); font-weight:500; }
.banner .linkbtn{ color:inherit; text-decoration:underline; }

/* ---------- controls ---------- */
button{ font:inherit; cursor:pointer; }
.btn{ border:0; border-radius:8px; padding:8px 16px; min-height:36px; font-size:13.5px; background:var(--accent); color:var(--on-tint); font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn:hover{ filter:brightness(1.06); }
.btn[disabled]{ opacity:.45; cursor:default; }
.btn.sec{ background:var(--panel-2); color:var(--ink); }
.btn.ghost{ background:transparent; color:var(--dim); box-shadow:inset 0 0 0 1px var(--line); }
.btn.sec:hover, .btn.ghost:hover{ filter:none; background:var(--fill-tertiary); }
.btn.sm{ padding:6px 12px; min-height:32px; font-size:12.5px; }
.btn.big{ min-height:42px; width:100%; font-size:14px; border-radius:var(--r-control); }
.iconbtn{ border:0; background:transparent; color:var(--dim); width:32px; height:32px; border-radius:99px; display:flex; align-items:center; justify-content:center; padding:0; flex-shrink:0; }
.iconbtn:hover{ color:var(--ink); background:var(--fill-tertiary); }
.iconbtn:disabled{ opacity:.35; pointer-events:none; }
.linkbtn{ border:0; background:none; padding:0; color:var(--accent); font-weight:600; }
.linkbtn:hover{ text-decoration:underline; }
input[type=text]{ font:inherit; font-size:14px; width:100%; padding:8px 11px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); transition:border-color .16s var(--ease-standard), box-shadow .16s var(--ease-standard); }
input[type=text]:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
:where(button, [tabindex], input):focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.grp > .grp-row:focus-visible{ outline-offset:-2px; border-radius:var(--r-card); }
.seg{ display:inline-flex; gap:3px; background:var(--panel-2); padding:3px; border-radius:var(--r-control); }
.seg button{ border:0; background:transparent; color:var(--dim); font-weight:600; padding:6px 14px; min-height:32px; border-radius:7px; font-size:13px; }
.seg button[aria-checked="true"]{ background:var(--seg-thumb); color:var(--ink); box-shadow:var(--seg-thumb-shadow); }
.seg button:not([aria-checked="true"]):not(:disabled):hover{ color:var(--ink); }
.seg button:disabled{ opacity:.5; cursor:default; }
/* A radio: a ring that fills with the accent, and a dot that pops in with a bounce you can see
   (the dot is 8 px, so it's on the liveliest spring: it swells to 9 px and settles). The fill
   grows to the ring on a plain ease-out: on a spring it would swell past the ring.
   Unpicking is quick and plain; only the one being picked springs. */
.radio{ position:relative; width:20px; height:20px; border-radius:99px; box-shadow:inset 0 0 0 2px var(--control); flex-shrink:0;
  transition:box-shadow 160ms var(--ease-standard), transform var(--spring-snappy-ms) var(--spring-snappy); }
.radio::before, .radio::after{ content:""; position:absolute; border-radius:inherit; opacity:0; }
.radio::before{ inset:0; background:var(--accent); transform:scale(.5); transition:opacity 140ms var(--ease-standard), transform 140ms var(--ease-standard); }
.radio::after{ inset:6px; background:var(--on-tint); transform:scale(0); transition:opacity 100ms var(--ease-standard), transform 140ms var(--ease-standard); }
[aria-checked="true"] > .radio{ box-shadow:inset 0 0 0 2px var(--accent); }
[aria-checked="true"] > .radio::before{ opacity:1; transform:none;
  transition:opacity 120ms var(--ease-out), transform 220ms var(--ease-out); }
[aria-checked="true"] > .radio::after{ opacity:1; transform:none;
  transition:opacity 120ms var(--ease-out), transform var(--spring-pop-ms) var(--spring-pop); }
[role="radio"]:active > .radio{ transform:scale(.9); transition:transform 110ms var(--ease-out); }
/* the chosen row of a list of radios is washed with the accent */
.grp-row[role="radio"][aria-checked="true"], .grp-row.tap[role="radio"][aria-checked="true"]:hover{ background:var(--tint-wash); }


/* ---------- drop zone ---------- */
.drop{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px; padding:34px 20px; border-radius:var(--r-card); background:var(--panel); box-shadow:var(--elev-1); position:relative; cursor:pointer; }
.drop::after{ content:""; position:absolute; inset:8px; border-radius:10px; border:1.5px dashed var(--line); pointer-events:none; transition:border-color .16s var(--ease-standard); }
.drop:hover::after{ border-color:var(--faint); }
.drop .big-icon{ width:52px; height:52px; border-radius:var(--r-card); background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; transition:transform var(--spring-bouncy-ms) var(--spring-bouncy); }
.drop b{ font-size:16px; }
body.dragging .drop{ background:var(--accent-soft); }
body.dragging .drop::after{ border-color:var(--accent); }
body.dragging .drop .big-icon{ transform:translateY(-4px) scale(1.08); }
.drop.compact{ flex-direction:row; padding:14px 18px; gap:14px; text-align:left; justify-content:flex-start; }
.drop.compact .big-icon{ width:36px; height:36px; border-radius:var(--r-control); }
.drop.compact b{ font-size:14px; }

/* ---------- progress ---------- */
.bar{ height:10px; border-radius:99px; background:var(--panel-2); overflow:hidden; }
.bar{ --p:0; }  /* set here so a bar inside a bar's card never inherits another one's value */
/* The fill is as wide as the bar and slides in from the left, so only a transform moves (no layout
   while a video runs). --p is how full it is, 0 to 1. It's fed every 250 ms and takes a little
   longer than that to get there, so it keeps moving between numbers without falling behind the
   percentage beside it. A redraw carries it on from where it is (barsNow / barsCarry). */
.bar > i{ display:block; height:100%; width:100%; border-radius:99px; background:var(--accent);
  transform:translateX(calc(var(--p) * 100% - 100%)); transition:transform 280ms linear; }
.bar.thin{ height:5px; }
.bar.ok > i{ background:var(--ok); }
.bar.indeterminate > i{ width:35%; transform:translateX(-100%); animation:slide 1.4s var(--ease-standard) infinite; }
@keyframes slide{ from{ transform:translateX(-100%) } to{ transform:translateX(290%) } }
.big-pct{ font-size:40px; font-weight:800; letter-spacing:-.03em; line-height:1; }
.meters{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
.meter{ background:var(--panel-2); border-radius:var(--r-control); padding:10px 12px; }
.meter span{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); }
.meter b{ display:block; font-size:16px; font-weight:700; margin:1px 0 6px; font-variant-numeric:tabular-nums; }
.meter .bar{ background:color-mix(in srgb, var(--control) 40%, var(--panel-2)); }  /* (the track: the meter is --panel-2 too) */
.meter .bar > i{ background:var(--dim); transition:transform 450ms var(--ease-standard); }  /* a gauge: it eases to each reading */
.meter.hot .bar > i{ background:var(--accent); }
.log{ max-height:150px; overflow-y:auto; background:var(--panel-2); border-radius:var(--r-control); padding:10px 12px; white-space:pre-wrap; color:var(--dim); margin-top:10px; }
details summary{ cursor:pointer; color:var(--dim); font-size:12.5px; font-weight:600; list-style:none; }
details summary::-webkit-details-marker{ display:none; }
details summary::before{ content:"›"; display:inline-block; width:14px; transition:transform var(--spring-snappy-ms) var(--spring-snappy); }
details[open] summary::before{ transform:rotate(90deg); }

.success{ width:52px; height:52px; border-radius:99px; background:var(--ok-soft); color:var(--ok); display:flex; align-items:center; justify-content:center; }

/* ---------- dialog ---------- */
.scrim{ position:fixed; inset:0; display:flex; justify-content:center; z-index:60; }
/* What's new: a fixed header and button, and a timeline between them, oldest at the top */
.dialog.news-sheet{ display:flex; flex-direction:column; padding:8px 0 0; overflow:hidden; max-width:520px; }
.nv-head{ display:flex; align-items:center; gap:12px; padding:12px 24px 14px; }
.nv-head .tile-icon{ width:38px; height:38px; border-radius:11px; background:var(--accent-soft); color:var(--accent); }
.nv-head .sub{ font-size:12.5px; color:var(--dim); margin-top:2px; }
.nv-body{ flex:1; min-height:0; overflow-y:auto; padding:6px 24px 4px; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  mask-image:linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%); }
.nv-foot{ display:flex; justify-content:flex-end; padding:12px 20px 16px; }
.nv-foot .btn{ min-width:88px; min-height:34px; padding:7px 16px; font-size:13.5px; }
.timeline{ position:relative; padding:14px 0 6px 26px; }
.timeline::before{ content:""; position:absolute; left:6px; top:22px; bottom:22px; width:2px; border-radius:2px; background:var(--line); }
.nv{ position:relative; padding-bottom:22px; }
.nv:last-child{ padding-bottom:6px; }
.nv::before{ content:""; position:absolute; left:-26px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--panel); border:2px solid var(--faint); }
.nv.current::before{ background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
.nv-title{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.nv-title .v{ font-size:15px; font-weight:800; letter-spacing:-.01em; }
.nv-title .d{ font-size:12px; color:var(--faint); margin-left:auto; }
.nv-items{ display:flex; flex-direction:column; gap:12px; margin-top:12px; }
.nv-item{ background:var(--panel-2); border-radius:var(--r-control); padding:10px 12px; }
.nv-item b{ display:block; font-size:13.5px; line-height:1.35; }
.nv-item span{ display:block; font-size:12.5px; color:var(--dim); line-height:1.45; margin-top:2px; }
.nv-item.plain{ background:transparent; padding:0 12px; font-size:12.5px; color:var(--dim); line-height:1.45; }
.nv details summary{ margin-top:8px; }
.nv details .when-open, .nv details[open] .when-shut{ display:none; }
.nv details[open] .when-open{ display:inline; }
.nv details[open] summary{ margin-bottom:-2px; }
.dialog{ background:var(--panel); width:100%; overflow-y:auto; }
@keyframes fadeIn{ from{ opacity:0 } to{ opacity:1 } }
.player{ display:flex; align-items:center; gap:12px; background:var(--panel-2); border-radius:var(--r-card); padding:10px 14px 10px 10px; }
.playbtn{ width:44px; height:44px; border-radius:99px; border:0; background:var(--accent); color:var(--on-tint); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.wave{ display:flex; align-items:center; gap:2px; height:32px; flex:1; }
.wave i{ flex:1; border-radius:2px; background:var(--line); min-height:3px; transition:background-color .1s; }
.wave i.on{ background:var(--accent); }
.quote{ display:flex; gap:10px; padding:8px 0; font-size:14px; }
.quote + .quote{ border-top:1px solid var(--hairline); }
.quote .t{ color:var(--faint); font-variant-numeric:tabular-nums; font-size:12.5px; padding-top:1px; min-width:38px; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ border:0; background:var(--panel-2); color:var(--ink); border-radius:99px; padding:5px 12px; font-size:12.5px; font-weight:600; }
.chip:hover{ background:var(--accent-soft); color:var(--accent-ink); }

#toast-root{ position:fixed; right:20px; bottom:20px; z-index:80; display:flex; flex-direction:column; align-items:flex-end; gap:8px; pointer-events:none; }
.toast{ background:var(--ink); color:var(--bg); font-size:13px; font-weight:600; max-width:360px; }
.toast.bad{ background:var(--bad); color:var(--on-tint); }

kbd{ font:inherit; font-weight:600; background:var(--panel-2); border-radius:6px; padding:1px 6px; font-size:12.5px; }

@media (max-width:860px){ .meters{ grid-template-columns:repeat(2,minmax(0,1fr)); } }

/* ---------- settings: switches and the subtitle preview ---------- */
.switch{ width:40px; height:22px; border-radius:99px; border:0; padding:2px; background:var(--control); flex-shrink:0; position:relative;
  transition:background-color 200ms var(--ease-standard), filter 130ms var(--ease-standard); }
.switch:hover{ filter:brightness(.96); }
/* The knob springs across. While the mouse is down it grows 4 px wider towards where it is about
   to go (quickly, like any press), as it does on iOS, and springs back to round as it travels.
   It is one knob whose width changes: 18 px, alone in its switch, so nothing else is laid out. */
.switch span{ display:block; width:18px; height:18px; border-radius:99px; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25);
  transition:transform var(--spring-snappy-ms) var(--spring-snappy), width var(--spring-snappy-ms) var(--spring-snappy); }
.switch:active span{ width:22px; transition:transform 110ms var(--ease-out), width 110ms var(--ease-out); }
.switch[aria-checked="true"]{ background:var(--ok); }
.switch[aria-checked="true"] span{ transform:translateX(18px); }
.switch[aria-checked="true"]:active span{ transform:translateX(14px); }
.grp-row .seg{ flex-shrink:0; }
.frames{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.frame{ aspect-ratio:16/9; border-radius:10px; position:relative; overflow:hidden; display:flex; align-items:flex-end; justify-content:center;
  padding:0 8px 7%; background:radial-gradient(ellipse at 30% 20%, #5b6470, #262a31 70%); }
.frame i{ position:absolute; top:7px; left:9px; font-style:normal; font-size:10.5px; font-weight:700; color:rgba(255,255,255,.55); }
.frame span{ color:#fff; font-size:11.5px; line-height:1.35; font-weight:600; text-align:center; white-space:pre; text-shadow:0 1px 2px #000, 0 0 6px rgba(0,0,0,.6); }
.prefs-input{ max-width:100%; }

/* ---------- checking the lines before saving ---------- */
.rv-head{ position:sticky; top:-26px; z-index:5; background:var(--bg); padding:14px 0 12px; margin-top:-14px; margin-bottom:12px; box-shadow:0 1px 0 var(--line); }
.rv-tools{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.rv-tools input[type="text"]{ width:auto; flex:1; min-width:140px; font-size:14px; padding:8px 10px; }
.rv-tools .checkrow{ flex:none; align-items:center; color:var(--dim); }
.rv-names{ display:flex; flex-wrap:wrap; gap:8px; }
.rv-names label{ margin:0; display:flex; align-items:center; gap:6px; text-transform:none; letter-spacing:0; font-size:13px; color:var(--dim); font-weight:600; }
.rv-names input{ width:160px; font-size:14px; padding:7px 10px; }
.rv-name{ display:inline-flex; align-items:center; gap:4px; }
.rv-names select{ font:inherit; font-size:12.5px; padding:5px 6px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--dim); max-width:140px; }
.rv-row select:disabled{ opacity:.45; }
select{ cursor:pointer; transition:border-color 130ms var(--ease-standard), background-color 130ms var(--ease-standard); }
select:hover:not(:disabled){ border-color:var(--faint); }
.rv-list{ background:var(--panel); border-radius:var(--r-card); box-shadow:var(--elev-1); position:relative; }
.rv-row{ display:grid; grid-template-columns:32px 52px auto 1fr auto; gap:0 8px; align-items:start; padding:8px 10px 8px 8px; position:relative; }
.rv-row + .rv-row::before{ content:""; position:absolute; top:0; left:52px; right:0; height:1px; background:var(--hairline); }
.rv-row.no-spk{ grid-template-columns:32px 52px 1fr auto; }
/* "Too long" goes under the line, so the box being typed in never changes width */
.rv-row .rv-warn{ grid-column:4; grid-row:2; }
.rv-row.no-spk .rv-warn{ grid-column:3; }
.rv-warn:not(:empty){ padding:2px 0 2px 8px; }
.rv-time{ font:inherit; font-size:12px; color:var(--faint); margin-top:4px; padding:4px 4px; border:0; border-radius:6px; background:none;
  font-variant-numeric:tabular-nums; cursor:pointer; text-align:left; }
.rv-time:hover, .rv-time[aria-expanded="true"]{ background:var(--fill-tertiary); color:var(--ink); }
.rv-acts{ display:flex; gap:2px; }
.rv-acts .iconbtn.quiet{ opacity:.35; }
.rv-row:hover .rv-acts .iconbtn.quiet, .rv-row:focus-within .rv-acts .iconbtn.quiet{ opacity:1; }
.rv-timing{ grid-column:2 / -1; display:flex; flex-wrap:wrap; gap:14px; align-items:center; padding:2px 0 6px; font-size:13px; color:var(--dim); }
.rv-timing .nudge{ display:flex; align-items:center; gap:4px; }
.rv-timing input{ width:92px; font-size:13px; padding:5px 8px; text-align:center; font-variant-numeric:tabular-nums; }
.rv-timing .btn{ padding:4px 9px; min-width:0; }
.seg.langs button{ padding:6px 10px; white-space:nowrap; }  /* six choices fit at the narrowest window */
.lang-list{ font:inherit; font-size:14px; padding:8px 10px; border-radius:var(--r-control); border:1px solid var(--line); background:var(--panel-2); color:var(--ink); max-width:300px; }
.rv-row select{ font:inherit; font-size:13px; padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); max-width:150px; }
.rv-row textarea{ font:inherit; font-size:14.5px; line-height:1.4; width:100%; resize:none; border:1px solid transparent; border-radius:8px; padding:6px 8px;
  background:transparent; color:var(--ink); overflow:hidden; field-sizing:content; min-height:34px; }
.rv-row textarea:hover{ background:var(--fill-tertiary); }
.rv-row textarea:focus{ outline:none; border-color:var(--accent); background:var(--panel); box-shadow:0 0 0 3px var(--accent-soft); }
.rv-row.gone textarea, .rv-row.gone .rv-time{ text-decoration:line-through; opacity:.45; }
.rv-row.playing .rv-play{ color:var(--accent); background:var(--accent-soft); }

/* ---------- starting screen ---------- */
.loader{ position:fixed; inset:0; z-index:100; background:var(--bg); display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:14px; text-align:center; padding:24px; transition:opacity .35s var(--ease-out); }
.loader img{ border-radius:18px; box-shadow:var(--elev-2); }
.loader b{ font-size:17px; }
.loader .bar{ width:220px; height:6px; }
.loader p{ margin:0; max-width:420px; color:var(--dim); font-size:13.5px; white-space:pre-line; }
.loader.problem .bar{ display:none; }
.loader.gone{ opacity:0; pointer-events:none; }

/* ---------- setup wizard: the sidebar steps aside ---------- */
body.wizard .shell{ grid-template-columns:1fr; }
body.wizard aside.side{ display:none; }
.wiz{ max-width:620px; margin:0 auto; min-height:calc(100vh - 74px); display:flex; flex-direction:column; }
.wiz-steps{ display:flex; gap:6px; margin:4px 0 30px; }
.wiz-steps i{ flex:1; height:4px; border-radius:99px; background:var(--panel-2); transition:background-color .3s var(--ease-standard); }
.wiz-steps i.on{ background:var(--accent); }
.wiz h1{ font-size:28px; letter-spacing:-.03em; }
.wiz .lede{ color:var(--dim); font-size:15px; margin:6px 0 22px; }
.wiz-body{ flex:1; }
.wiz-nav{ display:flex; gap:10px; padding-top:22px; }
.wiz-nav .btn{ min-height:40px; padding:9px 22px; font-size:14px; }
.hero-icon{ display:block; border-radius:18px; margin-bottom:18px; box-shadow:var(--elev-2); }
.facts{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.fact{ background:var(--panel); box-shadow:var(--elev-1); border-radius:var(--r-card); padding:14px; }
.fact span{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); }
.fact b{ display:block; font-size:15px; margin-top:3px; }

/* ---------- update sheet ---------- */
.newslist{ display:flex; flex-direction:column; gap:8px; font-size:13.5px; }
.news{ display:flex; gap:10px; align-items:baseline; }
.news .pill{ flex-shrink:0; min-width:64px; text-align:center; }
.steplist{ display:flex; flex-direction:column; gap:12px; }
.step{ display:flex; gap:12px; align-items:flex-start; }
.step .dot{ width:24px; height:24px; border-radius:99px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--panel-2); color:var(--faint); font-size:12px; font-weight:800; }
.step.active .dot{ background:var(--accent-soft); color:var(--accent-ink); }
.step.done .dot{ background:var(--ok-soft); color:var(--ok); }
.step .grow > b{ font-weight:600; }
.step:not(.active):not(.done) .grow > b{ color:var(--dim); font-weight:500; }

/* ---------- Settings > Quality: a card per level, what this PC has, and Save ---------- */
.q{ display:grid; grid-template-columns:minmax(0,1fr); gap:18px; }
.q-side{ display:contents; }   /* one column: This PC goes above the levels and Save below them */
.q-pc{ order:-1; }
.q-levels{ container-type:inline-size; display:flex; flex-direction:column; gap:10px; }
.q-save > .block{ margin-top:0; }
/* what saving will do, under Save, so Save stays put as the words change */
.q-hint{ font-size:12.5px; color:var(--dim); margin:10px 4px 0; }
/* Settings > Quality: a level a Hardware limit makes slow, or won't fit */
.lv-warn{ display:flex; gap:6px; align-items:flex-start; font-size:12px; color:var(--accent-ink); margin-top:4px; }
.lv-warn svg{ flex-shrink:0; margin-top:2px; }
/* Settings > Hardware */
.hw-presets{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; }
.hw-presets .lv{ grid-template-areas:"radio main"; padding:12px 14px; gap:10px 12px; }
@media (max-width:760px){ .hw-presets{ grid-template-columns:minmax(0,1fr); } }
.hw-status{ font-size:13px; color:var(--ink); margin:10px 16px 0; }
.hw-status .dim{ display:block; font-size:12.5px; margin-top:2px; }
.hw-more > summary{ font-size:13.5px; padding:4px 16px; color:var(--accent-ink); }
.hw-more-body{ margin-top:14px; }
.hw-more-body > .block + .block{ margin-top:18px; }
/* rows whose words run to two lines: the control lines up with the title, not the middle */
.grp-row:has(#ps-memory_limit_gb), .grp-row:has(#ps-cpu_percent){ align-items:flex-start; }
.grp-row:has(#ps-memory_limit_gb) .seg button{ padding:6px 10px; }
.lv:has(.lv-warn){ align-items:start; }
.lv:has(.lv-warn) > .radio{ margin-top:2px; }
.hw-live{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; }
.hw-live .meter b small{ font-size:12px; font-weight:600; color:var(--dim); }
.hw-note{ font-size:12.5px; color:var(--dim); margin:0; }
.run-own{ font-size:12px; color:var(--dim); margin-top:-4px; }
.switch:disabled{ opacity:.45; cursor:default; filter:none; }
.q-hint b{ color:var(--ink); font-weight:600; }
/* the downloads, in the narrow side column: the amount stays on one line beside the name */
.q-save #downloads .between{ gap:10px; align-items:baseline; }
.q-save #downloads .between > .mono{ white-space:nowrap; flex-shrink:0; }
/* two columns once the levels still have room for their stats beside a narrow side column (a
   1100 px window has about 810 px for the page: one column there, This PC above the levels), and
   a wider side column in a big window */
@media (min-width:1240px){
  .q{ grid-template-columns:minmax(0,1fr) 288px; gap:20px; align-items:start; }
  .q-side{ display:flex; flex-direction:column; gap:16px; position:sticky; top:0; }
  .q-pc{ order:0; }
}
@media (min-width:1600px){ .q{ grid-template-columns:minmax(0,1fr) 340px; gap:24px; } }
.lv{ position:relative; display:grid; grid-template-columns:20px minmax(0,1fr); grid-template-areas:"radio main" ". extra"; gap:10px 14px; align-items:center;
  padding:14px 18px 14px 16px; border-radius:var(--r-card); background:var(--panel); box-shadow:var(--elev-1); cursor:pointer;
  transition:background-color 180ms var(--ease-standard), box-shadow 180ms var(--ease-standard), transform var(--spring-snappy-ms) var(--spring-snappy); }
.lv > .radio{ grid-area:radio; }
.lv-main{ grid-area:main; min-width:0; }
.lv-extra{ grid-area:extra; display:flex; flex-wrap:wrap; align-items:center; gap:8px 24px; }
@container (min-width:600px){
  .lv{ grid-template-columns:20px minmax(0,1fr) auto; grid-template-areas:"radio main extra"; }
  .lv-extra{ flex-wrap:nowrap; }
}
/* the chosen level: a ring in the accent (it fades in over the card) and a wash of it */
.lv::after{ content:""; position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 0 0 2px var(--accent); opacity:0; pointer-events:none;
  transition:opacity 180ms var(--ease-standard); }
.lv:hover{ box-shadow:var(--elev-2); }
.lv:active{ transform:scale(.992); transition:background-color 180ms var(--ease-standard), box-shadow 180ms var(--ease-standard), transform 110ms var(--ease-out); }
.lv[aria-checked="true"]{ background:color-mix(in srgb, var(--accent) 6%, var(--panel)); }
.lv[aria-checked="true"]::after{ opacity:1; }
.lv:focus-visible{ outline-offset:0; }   /* against the card's edge: with the chosen ring inside, one thicker ring */
.lv-head{ display:flex; align-items:center; flex-wrap:wrap; gap:5px 8px; }
.lv-name{ font-size:15px; font-weight:700; letter-spacing:-.01em; }
.lv-tags{ display:contents; }
.lv-head .pill{ display:inline-flex; align-items:center; gap:4px; }
.lv-head .pill svg{ width:10px; height:10px; }
/* how fast and how accurate, as five small bars each */
.lv-meters{ display:grid; grid-template-columns:auto auto; align-items:center; gap:6px 10px; font-size:11.5px; font-weight:600; color:var(--dim); }
.dots{ display:flex; gap:3px; }
.dots i{ width:13px; height:5px; border-radius:3px; box-shadow:inset 0 0 0 1px var(--control); transition:background-color 180ms var(--ease-standard), box-shadow 180ms var(--ease-standard); }
.dots i.on{ background:var(--dim); box-shadow:none; }
.lv[aria-checked="true"] .dots i.on{ background:var(--accent); }
.lv-stats{ display:grid; grid-template-columns:auto auto; gap:4px 12px; min-width:146px; font-size:11.5px; color:var(--dim); }
.lv-stats b{ font-weight:600; color:var(--ink); text-align:right; font-variant-numeric:tabular-nums; }
/* only the download (no graphics card): the size under its label, in a column of the same width on every card */
.lv-stats.one{ grid-template-columns:auto; gap:1px; min-width:64px; text-align:right; }
/* This PC: what it has, in a few labelled facts. Beside its heading when the card is wide; under
   it, past a line, when it isn't; and in the side column, one fact a row with its value at the end. */
.q-pc{ container-type:inline-size; }
.pc{ display:flex; flex-wrap:wrap; align-items:center; gap:12px 28px; padding:14px 16px; }
.pc-head{ display:flex; align-items:center; gap:12px; }
.pc-facts{ flex:1; min-width:260px; display:grid; grid-template-columns:repeat(auto-fit, minmax(104px, 1fr)); gap:12px 18px; }
.pc-fact span{ display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); }
.pc-fact b{ display:block; font-size:13.5px; font-weight:600; margin-top:1px; }
@container (max-width:599px){
  .pc-facts{ flex-basis:100%; min-width:0; grid-template-columns:repeat(2, minmax(0,1fr)); border-top:1px solid var(--hairline); padding-top:12px; }
}
@container (max-width:360px){
  .pc-facts{ grid-template-columns:minmax(0,1fr); gap:0; padding-top:2px; }
  .pc-fact{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:8px 0; }
  .pc-fact + .pc-fact{ border-top:1px solid var(--hairline); }
  .pc-fact:last-child{ padding-bottom:0; }
  .pc-fact b{ margin-top:0; text-align:right; }
}

/* ---------- Settings > About ---------- */
.about-hero{ display:flex; align-items:center; gap:22px; padding:22px 24px; }
.about-hero img{ border-radius:21px; box-shadow:0 0 0 1px var(--hairline), var(--elev-2); flex-shrink:0; }
.about-name{ font-size:17px; font-weight:700; letter-spacing:-.01em; }
.about-ver{ display:flex; align-items:baseline; gap:8px; }
.about-ver span{ font-size:13px; font-weight:600; color:var(--dim); }
.about-ver b{ font-size:38px; font-weight:800; letter-spacing:-.03em; line-height:1.15; font-variant-numeric:tabular-nums; }
.about-meta{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; margin-top:6px; font-size:12.5px; color:var(--dim); }
.about-unknown{ font-size:14px; font-weight:600; color:var(--dim); margin-top:2px; }
.about-path{ font-size:13px; color:var(--dim); overflow-wrap:anywhere; }
@media (max-width:820px){ .about-hero{ gap:16px; padding:18px; } .about-hero img{ width:72px; height:72px; border-radius:17px; } .about-ver b{ font-size:32px; } }

/* ---------- Using it in Resolve: numbered steps, menu paths as chips, a callout and tips ---------- */
.guide .block + .block{ margin-top:26px; }
.g-steps{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:minmax(0,1fr); gap:12px; }
.g-step{ display:grid; grid-template-columns:30px minmax(0,1fr); gap:14px; align-items:start; align-content:start; padding:16px 18px 16px 16px; }
.g-num{ width:30px; height:30px; border-radius:99px; background:var(--accent); color:var(--on-tint); font-size:14px; font-weight:800;
  display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums; }
.g-step h3{ font-size:15px; line-height:1.35; padding-top:5px; }  /* centred on the 30 px number, and still when it wraps */
.g-step p{ font-size:13px; line-height:1.55; color:var(--dim); margin-top:2px; }
.g-step p + p{ margin-top:8px; }
.path{ display:inline-flex; flex-wrap:wrap; align-items:center; gap:4px 0; vertical-align:middle; }
.path .hop{ display:inline-flex; align-items:center; white-space:nowrap; }  /* an arrow stays with the name after it */
.path kbd, kbd.key{ background:var(--panel-2); color:var(--ink); border-radius:6px; padding:2px 8px; font-size:12.5px; font-weight:600; line-height:1.5;
  box-shadow:inset 0 0 0 1px var(--hairline); white-space:nowrap; }
.path .hop svg{ color:var(--faint); margin:0 5px; flex-shrink:0; }
.g-two{ display:grid; grid-template-columns:minmax(0,1fr); gap:26px 24px; margin-top:26px; align-items:start; }
.g-two > .block{ margin-top:0 !important; }
.g-callout{ background:var(--accent-soft); border-radius:var(--r-card); padding:18px; }
.g-callout-head{ display:flex; align-items:flex-start; gap:12px; }
.g-callout-head .tile-icon{ background:var(--accent); color:var(--on-tint); }
.g-callout .linkbtn{ color:var(--accent-ink); }
.g-callout-head b{ display:block; font-size:15px; letter-spacing:-.01em; }
.g-callout-head p{ font-size:13px; line-height:1.5; margin-top:1px; }
.g-mini{ list-style:none; margin:14px 0 0; padding:0; counter-reset:mini; display:flex; flex-direction:column; gap:8px; }
.g-mini li{ counter-increment:mini; display:grid; grid-template-columns:22px minmax(0,1fr); gap:10px; font-size:13.5px; line-height:1.55;
  background:var(--panel); border-radius:var(--r-control); padding:9px 12px 9px 10px; }
.g-mini li::before{ content:counter(mini); width:22px; height:22px; border-radius:99px; background:var(--accent-soft); color:var(--accent-ink);
  font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; }
.g-note{ display:flex; align-items:flex-start; gap:8px; font-size:12.5px; line-height:1.5; margin-top:12px; }
.g-note svg{ flex-shrink:0; margin-top:1px; color:var(--accent); }
@media (min-width:900px){ .g-steps{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
@media (min-width:1060px){ .g-two{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
/* a big window: the four steps in one row (each is a line or two) */
@media (min-width:1600px){ .g-steps{ grid-template-columns:repeat(4, minmax(0,1fr)); } }

/* =================================================================
   MOTION. Things that move are on springs (the tokens at the top), and a
   change of mind halfway is followed from where the thing is, not from
   where it started: states are CSS transitions, which retarget, and the
   script carries on from the place on screen when it has to redraw.
   Only transform and opacity move (and the width of two small things that
   nothing else is laid out around: a segmented control's pill and a
   switch's knob). Motion answers what changed: arriving on a screen
   animates, a redraw caused by a click doesn't replay anything.
   ================================================================= */
/* --- screens: drilling in, the new one comes 12 px in from the right on a spring, and from the
   left going back, as one sheet (every section together), while the old one fades out over it
   and drifts the other way (the .view-ghost, see arrive()). Between tabs nothing travels: the old
   one fades out quickly and the new one fades in. The fade is its own short ease-out beside the
   spring. --- */
.screen-visible > *{ animation:navEnter var(--spring-spatial-ms) var(--spring-spatial) backwards, fadeIn 180ms var(--ease-out) backwards; }
.screen-visible.nav-back > *{ animation-name:navEnterBack, fadeIn; }
.screen-visible.nav-tab > *{ animation:fadeIn 180ms var(--ease-out) backwards; }
@keyframes navEnter{ from{ transform:translateX(12px) } }
@keyframes navEnterBack{ from{ transform:translateX(-12px) } }
/* the old screen's copy sits in a window the size of the page area, so it can't draw outside it */
.view-ghost{ position:fixed; overflow:hidden; z-index:6; pointer-events:none; }
.view-ghost > *{ position:absolute; margin:0; max-width:none; }
/* bars fill up when they appear (no spring: a bar that overshoots is showing a wrong number) */
.screen-visible .bar:not(.indeterminate) > i{ animation:barGrow 420ms var(--ease-out) backwards; }
@keyframes barGrow{ from{ transform:translateX(-100%) } }
/* a tick pops with a little bounce and draws itself, once, when it turns up */
.screen-visible .success, .step.done.just .dot{ animation:checkIconIn var(--spring-bouncy-ms) var(--spring-bouncy) backwards, fadeIn 150ms var(--ease-out) backwards; }
@keyframes checkIconIn{ from{ transform:scale(.6) } }
.screen-visible .success svg path{ stroke-dasharray:20 24; animation:tickDraw 340ms var(--ease-out) 140ms backwards; }
@keyframes tickDraw{ from{ stroke-dashoffset:22 } }

/* --- hover and press. Hover is a quick colour change, never a spring. A press is physical: the
   control dips a little straight away and springs back when let go. It's a mouse, not a thumb, so
   the dip is small (small things dip more than wide ones, or a wide button would move many pixels). --- */
.btn, .iconbtn, .seg button, .navbtn, .sidecard, .drop, .chip, .playbtn, .grp-row.tap, .rv-time, .dlg-x, .toast-dismiss, .back, .linkbtn{
  transition:background-color 130ms var(--ease-standard), filter 130ms var(--ease-standard), color 130ms var(--ease-standard),
             box-shadow 130ms var(--ease-standard), opacity 130ms var(--ease-standard),
             transform var(--spring-snappy-ms) var(--spring-snappy); }
/* going down is quicker and plain; the spring above is for coming back up */
:is(.btn, .iconbtn, .seg button, .navbtn, .sidecard, .drop, .chip, .playbtn, .grp-row.tap, .rv-time, .dlg-x, .toast-dismiss, .back, .linkbtn):active{
  transition:background-color 60ms var(--ease-standard), filter 60ms var(--ease-standard), color 60ms var(--ease-standard),
             box-shadow 60ms var(--ease-standard), opacity 60ms var(--ease-standard), transform 110ms var(--ease-out); }
.btn:active:not([disabled]){ filter:brightness(.92); transform:scale(.97); }
.btn.sm:active:not([disabled]){ transform:scale(.96); }
.btn.big:active:not([disabled]){ transform:scale(.988); }
.btn.sec:active:not([disabled]), .btn.ghost:active:not([disabled]){ filter:none; background:var(--line); }
.seg button{ transition:background-color 130ms var(--ease-standard), filter 130ms var(--ease-standard), color 200ms var(--ease-standard),
             box-shadow 130ms var(--ease-standard), opacity 130ms var(--ease-standard), transform var(--spring-snappy-ms) var(--spring-snappy); }
.seg button:active{ filter:brightness(.95); }
/* a segment dips while pressed; the chosen one's pill dips with its words, by as much and as quickly */
.seg button:active:not(:disabled){ transform:scale(.96); }
.chip:active{ filter:brightness(.95); transform:scale(.97); }
.iconbtn:active, .playbtn:active, .dlg-x:active{ transform:scale(.94); }
.toast-dismiss:active{ transform:scale(.92); }
.rv-time:active{ transform:scale(.95); }
.navbtn:active, .sidecard:active{ background:var(--fill-secondary); transform:scale(.98); }
.drop:active{ transform:scale(.992); }
.linkbtn:active{ opacity:.6; }
.grp-row.tap:active{ background:var(--fill-secondary, var(--fill-tertiary)); transform:scale(.992); }
.btn:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

/* --- dialogs: a window in the middle, the way desktop apps ask. The backdrop fades in (and softens
   the app behind it a little) and the window, which is inside it, fades in with it while it grows
   from 95% on a spring; closing shrinks it and fades both back. They are transitions, so closing
   one that is still opening carries on from where it is. A dialog that redraws itself (the update
   one) keeps these two elements and changes what's inside, so it never opens twice. Esc or the
   corner ✕ closes it, and a click outside gives it a shake instead of closing it (so a stray
   click never throws away what you typed). Blocking ones have no ✕ and ignore Esc. --- */
.scrim{ align-items:center; padding:24px; background:rgba(20,18,16,.32); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  transition:opacity 200ms var(--ease-standard); }
.dialog{ position:relative; max-width:460px; border-radius:12px; max-height:min(86vh, 720px); padding:22px 24px 20px;
  box-shadow:0 0 0 1px rgba(0,0,0,.06), 0 10px 24px rgba(0,0,0,.12), 0 30px 70px rgba(0,0,0,.18);
  transition:transform var(--spring-spatial-ms) var(--spring-spatial); }
@starting-style{
  .scrim{ opacity:0; }
  .dialog{ transform:scale(.95); }
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .scrim{ background:rgba(0,0,0,.5); }
  :root:not([data-theme="light"]) .dialog{ box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 0 0 1px rgba(255,255,255,.13), 0 12px 28px rgba(0,0,0,.5), 0 32px 72px rgba(0,0,0,.55); } }
:root[data-theme="dark"] .scrim{ background:rgba(0,0,0,.5); }
:root[data-theme="dark"] .dialog{ box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 0 0 1px rgba(255,255,255,.13), 0 12px 28px rgba(0,0,0,.5), 0 32px 72px rgba(0,0,0,.55); }
/* leaving is quicker than arriving, and doesn't bounce (closeDialogs() waits for the fade) */
.scrim.is-closing{ opacity:0; transition:opacity 170ms var(--ease-standard); }
.dialog.is-closing{ transform:scale(.96); transition:transform 170ms var(--ease-standard); }
/* the corner ✕ (added to every dialog that can be closed) */
.dlg-x{ all:unset; box-sizing:border-box; position:absolute; top:12px; right:12px; width:28px; height:28px; border-radius:7px; display:flex;
  align-items:center; justify-content:center; color:var(--faint); cursor:pointer; z-index:2; }
.dlg-x svg{ width:12px; height:12px; }
.dlg-x:hover{ background:var(--fill-tertiary); color:var(--ink); }
.dlg-x:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
.dialog.has-x h3{ padding-right:30px; }
.dialog.news-sheet .dlg-x{ top:16px; right:14px; }
.nv-head{ padding-right:48px !important; }
/* a confirmation: the question, what happens, then Cancel and the action at the bottom right */
.dialog.confirm{ max-width:420px; padding:22px 24px 18px; }
.confirm .cf-text{ font-size:13.5px; color:var(--dim); line-height:1.5; margin:8px 0 0; }
.dlg-foot{ display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-top:20px; }
.stack > .dlg-foot{ margin-top:6px; }
.dlg-foot .btn{ min-width:88px; min-height:34px; padding:7px 16px; font-size:13.5px; }
.dlg-foot .note{ margin-right:auto; }

/* --- toasts: bottom right. One rises into the corner on the same spring the ones already there
   slide up on to make room (toast() moves them), so the stack moves as one; it grows from its
   bottom edge, which stays level. They slide back down when one leaves. Leaving goes off to the
   right. --- */
.toast{ display:flex; align-items:center; gap:10px; padding:10px 12px 10px 16px; border-radius:10px; pointer-events:auto;
  box-shadow:0 2px 8px rgba(0,0,0,.08), 0 12px 28px rgba(0,0,0,.16); transform-origin:50% 100%;
  animation:toastIn var(--spring-spatial-ms) var(--spring-spatial) backwards, fadeIn 150ms var(--ease-out) backwards; }
.toast-dismiss{ all:unset; box-sizing:border-box; flex-shrink:0; width:20px; height:20px; border-radius:99px; display:flex; align-items:center; justify-content:center; opacity:.7; font-size:11px; cursor:pointer; position:relative; }
.toast-dismiss::after{ content:""; position:absolute; inset:-4px; }
.toast-dismiss:hover{ opacity:1; background:rgba(127,127,127,.22); }
/* a leaving toast steps out of the stack (so the others can close the gap while it goes) */
.toast.is-leaving{ position:absolute; right:0; pointer-events:none; }
@keyframes toastIn{ from{ transform:translateY(14px) scale(.96) } }

/* --- segmented controls: the selection is a pill that slides to the new choice on a spring (only
   when the choice changes), and dips with its words while it's pressed. Its place is `translate` and
   its width changes with it (never stretched, which would squash its corners): it's out of the
   flow, so its width lays out nothing else. syncSegs() sets --x and the width, and runs the slide
   itself (an animation the pill keeps when a redraw moves it to the new control, so a redraw
   part-way doesn't stop it). The press is `scale`, a transition of its own beside the slide. --- */
.seg.has-pill{ position:relative; }
.seg.has-pill button{ position:relative; z-index:1; }
.seg.has-pill button[aria-checked="true"]{ background:transparent; box-shadow:none; }
.seg-pill{ position:absolute; top:3px; left:0; height:calc(100% - 6px); width:0; z-index:0; pointer-events:none;
  border-radius:7px; background:var(--seg-thumb); box-shadow:var(--seg-thumb-shadow);
  translate:var(--x, 0px) 0; scale:var(--press, 1);
  transition:scale var(--spring-snappy-ms) var(--spring-snappy); }
.seg.has-pill:has(button[aria-checked="true"]:active:not(:disabled)) .seg-pill{ --press:.96; transition:scale 110ms var(--ease-out); }
/* Carried across a redraw (carryMotion): for one layout the new element is put how the old one
   was, with nothing easing, and then let go, so its own transitions take it from there. */
.carry, .carry *, .carry::before, .carry::after, .carry *::before, .carry *::after{ transition:none !important; }

/* --- checking the lines: a row taken out to be faded away (see rvMoved()) --- */
.rv-ghost{ position:absolute; left:0; right:0; margin:0; pointer-events:none; }

/* --- less motion: Windows' setting or Settings > Less animations. Nothing travels, grows or
   bounces. Every spring is given no time at all, so whatever it moves is simply there; colours
   and fades keep their short transitions, since they move nothing; things appear with a short
   fade; and the script's own animations (rows, toasts, screens, the shake) are skipped by
   prefersReducedMotion(). Both lists below must say the same. --- */
@media (prefers-reduced-motion:reduce){
  :root{ --spring-snappy-ms:0ms; --spring-default-ms:0ms; --spring-spatial-ms:0ms; --spring-bouncy-ms:0ms; --spring-pop-ms:0ms; }
  .screen-visible > *, .toast{ animation:fadeIn .12s linear backwards !important; }
  .scrim, .loader{ transition:opacity .12s linear !important; }
  .dialog{ transform:none !important; transition:none !important; }
  .bar > i{ transition:none !important; }
  body.dragging .drop .big-icon{ transform:none !important; }
  .bar.indeterminate > i{ width:100% !important; transform:none !important; animation:pulse 1.6s ease-in-out infinite alternate !important; }
  .screen-visible .bar > i, .success, .success svg path, .step.done .dot{ animation:none !important; }
  :is(.btn, .iconbtn, .seg button, .navbtn, .sidecard, .drop, .chip, .playbtn, .grp-row.tap, .rv-time, .dlg-x, .toast-dismiss, .lv):active{ transform:none !important; }
  [role="radio"]:active > .radio{ transform:none !important; }
  .radio::before, .radio::after{ transform:none !important; transition:opacity .12s linear !important; }
  .switch:active span{ width:18px !important; }
  .switch[aria-checked="true"]:active span{ transform:translateX(18px) !important; }
  .seg-pill{ --press:1 !important; }
}
html.reduce-motion{ --spring-snappy-ms:0ms; --spring-default-ms:0ms; --spring-spatial-ms:0ms; --spring-bouncy-ms:0ms; --spring-pop-ms:0ms; }
html.reduce-motion .screen-visible > *, html.reduce-motion .toast{ animation:fadeIn .12s linear backwards !important; }
html.reduce-motion .scrim, html.reduce-motion .loader{ transition:opacity .12s linear !important; }
html.reduce-motion .dialog{ transform:none !important; transition:none !important; }
html.reduce-motion .bar > i{ transition:none !important; }
html.reduce-motion body.dragging .drop .big-icon{ transform:none !important; }
html.reduce-motion .bar.indeterminate > i{ width:100% !important; transform:none !important; animation:pulse 1.6s ease-in-out infinite alternate !important; }
@keyframes pulse{ from{ opacity:.35 } to{ opacity:.8 } }
html.reduce-motion .screen-visible .bar > i, html.reduce-motion .success, html.reduce-motion .success svg path, html.reduce-motion .step.done .dot{ animation:none !important; }
html.reduce-motion :is(.btn, .iconbtn, .seg button, .navbtn, .sidecard, .drop, .chip, .playbtn, .grp-row.tap, .rv-time, .dlg-x, .toast-dismiss, .lv):active{ transform:none !important; }
html.reduce-motion [role="radio"]:active > .radio{ transform:none !important; }
html.reduce-motion .radio::before, html.reduce-motion .radio::after{ transform:none !important; transition:opacity .12s linear !important; }
html.reduce-motion .switch:active span{ width:18px !important; }
html.reduce-motion .switch[aria-checked="true"]:active span{ transform:translateX(18px) !important; }
html.reduce-motion .seg-pill{ --press:1 !important; }
</style>
</head>
<body>
<!-- Shown until the app is ready; it says so if starting takes too long or goes wrong -->
<div id="loader" class="loader" role="status" aria-live="polite">
  <img src="icon.svg" width="72" height="72" alt="">
  <b id="loader-title">Starting Subtitle Maker</b>
  <div class="bar indeterminate" id="loader-bar"><i></i></div>
  <p id="loader-text">Getting things ready…</p>
  <div id="loader-actions" class="row"></div>
</div>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="mark"><img src="icon.svg" width="30" height="30" alt=""></div>
      <b>Subtitle Maker</b>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-pill" id="nav-pill"></div>
      <button class="navbtn" data-view="make" aria-current="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M7 15h4M13 15h4M7 11h10"/></svg>
        Make subtitles <span class="count hide" id="queue-count"></span>
      </button>
      <button class="navbtn" data-view="history">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3.5 4.5V8H7M12 7.5V12l3 2"/></svg>
        History
      </button>
      <button class="navbtn" data-view="settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        Settings
      </button>
      <button class="navbtn" data-view="help">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17.2v.1"/></svg>
        Using it in Resolve
      </button>
    </nav>
    <div class="spacer"></div>
    <button class="sidecard" id="pc-card" title="Change quality or language">
      <b id="pc-level">…</b>
      <span class="dim" id="pc-detail">Checking this PC…</span>
    </button>
    <button class="verbtn" id="ver" type="button" title="About Subtitle Maker"></button>
  </aside>

  <main class="main" id="main"><div class="inner" id="view"></div></main>
</div>
<div id="dialog-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script>
/* ---------------------------------------------------------------------
   State. The Python side (app.py) pushes events in with app.onEvent();
   everything the page asks for goes through window.pywebview.api.
--------------------------------------------------------------------- */
/* The quick choices (the languages most videos here are in), then "More" for every other one Whisper knows */
const LANGS = [["en", "English"], ["zh", "Chinese"], ["ms", "Malay"], ["ta", "Tamil"], [null, "Auto-detect"], ["other", "More…"]];

/* Segmented controls get a pill that slides to the selection, and only when it changes in place:
   a redraw with the same selection leaves it where it is, and arriving on a screen puts it
   straight on the choice (nothing to slide from). It starts from where the old pill was
   (segNow, noted just before a redraw: it may have been part-way to somewhere else): --x places
   it and its width goes from the old choice's to the new one's (it's out of the flow, so that
   lays out nothing else). CSS transitions would retarget no more smoothly (both start a turn
   from standing still) and are dropped when the redraw takes the pill out of the page.
   The slide is an animation on the pill itself, and a redraw hands the same pill on to the new
   control (an animation started by the script keeps its time while its element is out of the
   page), so a redraw part-way through a slide, with the same choice, doesn't stop it and set it
   off again: it is simply still sliding. The words change colour with it: each fades from the
   colour the old one had (the redraw would otherwise switch them in one frame while the pill is
   still on its way). */
function syncSegs(root) {
  const calm = prefersReducedMotion();
  const same = (a, b) => Math.abs(a.x - b.x) <= .5 && Math.abs(a.w - b.w) <= .5;
  root.querySelectorAll(".seg").forEach((seg, i) => {

      const ink = getComputedStyle(b).color;

    const stop = () => { if (pill.glide) pill.glide.cancel(); pill.glide = null; };

/* Switching page (the sidebar is the tab bar) crossfades; dir "in" or "back" slides instead.

let goSeq = 0;
/* `trail` is the pages a Settings page is reached through (see pageTrailTo), when it's asked for */
async function go(view, dir = "tab", page, trail) {
  const again = view === S.view && !S.setup;  // the tab you're already on
  // Asked for by name, a page opens. From the sidebar, Settings comes back on the page it was
  // left on (when places are remembered); clicked while already in Settings, it goes up to the list.
  const to = view !== "settings" ? S.page : page !== undefined ? page : again || !REMEMBERS() ? null : S.page || null;
  const through = trail || (to === S.page ? S.pageTrail : []);
  if (view === "settings" && again && S.page && !to && dir === "tab") dir = "back";
  // The sidebar answers the click at once (only how it looks: nothing drawn reads it), and how far
  // down the screen being left was is kept now, before anything can redraw it meanwhile

  const r = S.review, from = back ? r.undo : r.redo, to = back ? r.redo : r.undo;
  if (!from || !from.length) return;
  const step = from.pop();
  to.push({ what: step.what, focus: step.focus, cues: JSON.parse(JSON.stringify(r.cues)), names: { ...r.names } });
  r.cues = step.cues; r.names = step.names;
  r.typing = null; r.timing = null; r.caret = null;
  render();
  if (step.focus != null) {
    const box = $(`#review textarea[data-i="${step.focus}"]`);
    if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
  }
  toast(`${back ? "Undid" : "Redid"}: ${RV_WHAT[step.what] || step.what}.`);
}
const RV_WHAT = { typing: "typing", split: "split line", join: "joined lines", delete: "deleted line", restore: "brought back line",
  replace: "replace all", time: "time change", speaker: "speaker change", name: "speaker name",
  person: "new person", move: "moved lines" };
function rvUndoButtons() {
  const r = S.review, u = $("#rv-undo"), d = $("#rv-redo");
  if (u) u.disabled = !(r.undo && r.undo.length);
  if (d) d.disabled = !(r.redo && r.redo.length);
}
// Ctrl+Z / Ctrl+Y (and Ctrl+Shift+Z) while the lines are open. The find, replace, time and name
// boxes keep their own undo; the lines themselves use this one, so a join or split undoes too.
document.addEventListener("keydown", e => {
  if (!S.review || !(e.ctrlKey || e.metaKey) || e.altKey) return;
  const key = e.key.toLowerCase();
  if (key !== "z" && key !== "y") return;
  const t = e.target;
  if (t && t.matches && t.matches("input, select, textarea") && !t.matches('textarea[data-rv="text"], select[data-rv="speaker"], select[data-rv="move"]')) return;
  if ($("#dialog-root") && $("#dialog-root").innerHTML.trim()) return;
  e.preventDefault();
  rvStep(key === "z" && !e.shiftKey);
});

/* A new time for one end of a line, kept between its neighbours and at least 0.2 s long */
function rvSetTime(i, key, t) {
  const cues = S.review.cues, c = cues[i];
  const prev = cues.slice(0, i).reverse().find(x => !x.gone), next = cues.slice(i + 1).find(x => !x.gone);
  t = Math.round(t * 100) / 100;
  const lo = key === "start" ? (prev ? prev.end : 0) : c.start + 0.2;
  const hi = key === "start" ? c.end - 0.2 : (next ? next.start : Infinity);
  if (t < lo || t > hi) {
    toast(key === "start" ? (t < lo ? "It can't start before the line above ends." : "It has to start at least 0.2 s before it goes.")
      : (t > hi ? "It can't go after the next line starts." : "It has to show for at least 0.2 s."), true);
    t = Math.min(Math.max(t, lo), hi);
  }
  c[key] = t;
}

function rvCount() {
  const r = S.review, live = r.cues.filter(c => !c.gone).length, long = r.cues.filter((c, i) => !c.gone && rvTooLong(i)).length;
  const el = $("#rv-count");
  if (el) el.innerHTML = `${live} lines${long ? ` · <span style="color:var(--bad)">${long} too long</span>` : ""} · Enter goes to the next line · click a time to change it`;
}
function bindReview(root) {
  root.querySelectorAll("[data-rv]").forEach(el => {
    const i = +el.dataset.i;
    if (el.dataset.rv === "text") {
      el.oninput = () => {
        rvTyping(i);
        S.review.cues[i].text = el.value.replace(/\n/g, " ");
        $("#rv-warn-" + i).innerHTML = rvTooLong(i) ? '<span class="pill bad">Too long</span>' : "";
        rvCount();
      };
      const caret = () => { S.review.caret = { i, pos: el.selectionStart }; };
      el.onkeyup = caret; el.onclick = caret; el.onselect = caret;
      el.onkeydown = e => {
        if (e.key !== "Enter") return;
        e.preventDefault();
        const next = [...document.querySelectorAll('#review textarea[data-rv="text"]')].find(x => +x.dataset.i > i && !x.disabled);
        if (next) { next.focus(); next.setSelectionRange(next.value.length, next.value.length); }
      };
    } else if (el.dataset.rv === "start" || el.dataset.rv === "end") {
      el.onchange = () => {
        const t = unstamp(el.value);
        if (t === null) toast("Type a time like 1:02.35", true);
        else { rvSnap("time"); rvSetTime(i, el.dataset.rv, t); }
        render();
      };
      el.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); el.blur(); } };
    } else if (el.dataset.rv === "speaker") {
      el.onchange = () => {
        if (el.value === "new") {
          // Someone detection missed: a new person for this line, named straight away
          rvSnap("person");
          S.review.cues[i].speaker = +rvNewPerson();
          render();
          rvFocusName(String(S.review.cues[i].speaker));
          return toast("Added a new person for this line. Type their name above.");
        }
        rvSnap("speaker"); rvUndoButtons(); S.review.cues[i].speaker = +el.value;
        // The label's length changed, and so did the line counts in the people bar
        rvRefreshRow(i); rvCount(); rvUpdateNames();
      };
    } else if (el.dataset.rv === "move") {
      el.onchange = () => {
        const r = S.review, from = el.dataset.k, to = el.value;
        if (!to) return;
        const n = rvLinesOf(from);
        rvSnap("move");
        rvMoveAll(from, to);
        render();
        toast(`Moved ${n} line${n > 1 ? "s" : ""} from ${r.names[from]} to ${r.names[to]}.`);
      };
    } else if (el.dataset.rv === "name") {
      el.onchange = () => {
        const r = S.review, k = el.dataset.k, name = el.value.trim() || `Speaker ${+k + 1}`;
        // The same name as someone else is the same person: offer to put their lines together
        const twin = Object.keys(r.names).find(o => o !== k && r.names[o].trim().toLowerCase() === name.toLowerCase());
        if (twin) {
          const n = rvLinesOf(k);
          el.value = r.names[k];  // stays as it was if they say no
          return confirmBox(`${r.names[twin]} is already here`, `Put ${n ? `${n} line${n > 1 ? "s" : ""} from ` : ""}Speaker ${+k + 1} together with ${r.names[twin]}'s? They become one person.`,
            "Put together", () => { rvSnap("move"); rvMoveAll(k, twin); render(); toast(`Speaker ${+k + 1}'s lines are now ${r.names[twin]}'s.`); });
        }
        if (name === r.names[k]) { el.value = name; return; }
        rvSnap("name"); rvUndoButtons(); r.names[k] = name; el.value = name;
        rvShowName(k);
      };
      el.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); el.blur(); } };
    }
  });
}

async function loadHistory() {
  if (S.historyLoading) return;
  S.historyLoading = true;
  try { S.history = await api().history(); S.historyFailed = false; } catch (e) { S.historyFailed = !S.history; }
  S.historyLoading = false;
  if (S.view === "history") render();
}

function dayLabel(d) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const day = new Date(d); day.setHours(0, 0, 0, 0);
  const diff = Math.round((today - day) / 864e5);
  if (diff === 0) return "Today";
  if (diff === 1) return "Yesterday";
  return day.toLocaleDateString(undefined, { weekday: diff < 7 ? "long" : undefined, day: "numeric", month: "long",
    year: day.getFullYear() === today.getFullYear() ? undefined : "numeric" });
}

function viewHistory() {
  const items = S.history;
  const top = `<div class="topbar between" style="align-items:flex-start"><div><h1>History</h1>
      <p>Everything you've made subtitles for on this PC, newest first.</p></div>
      ${items && items.length ? `<button class="btn ghost sm" data-act="clear-history">Clear history</button>` : ""}</div>`;
  if (!items && S.historyFailed) return top + `<div class="card between"><span class="dim">Couldn't load the history.</span>
      <button class="btn sec sm" data-act="history-retry">Try again</button></div>`;
  if (!items) { loadHistory(); return top + `<div class="card"><div class="bar indeterminate"><i></i></div></div>`; }
  if (!items.length) return top + `<div class="card empty" style="text-align:center;padding:42px 20px">
      <div class="big-icon" style="margin:0 auto 12px;width:52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center">${ICON.srt}</div>
      <b>Nothing yet</b><div class="sm dim" style="margin-top:4px">Subtitles you make will show up here.</div>
      <button class="btn sec sm" data-act="goto-make" style="margin-top:14px">Make subtitles</button></div>`;
  const groups = [];
  for (const it of items) {
    const label = dayLabel(it.time);
    if (!groups.length || groups[groups.length - 1].label !== label) groups.push({ label, items: [] });
    groups[groups.length - 1].items.push(it);
  }
  const levelName = k => (S.info && S.info.levels[k] ? S.info.levels[k].name : k);
  const row = it => {
    const ok = it.status === "done", main = (it.files || [])[0];
    const time = new Date(it.time).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    const parts = ok ? [`${main ? main.count : 0} subtitles`, it.length ? clock(it.length) : null,
        it.speakers && it.speakers.length ? it.speakers.map(esc).join(", ") : null, levelName(it.level) + " quality"].filter(Boolean)
      : [esc(it.error || "Didn't finish")];
    const gone = ok && main && !main.exists;
    return `<div class="grp-row has-icon">
      <div class="tile-icon ${ok ? "t-ok" : "t-bad"}">${ok ? ICON.srt : ICON.x}</div>
      <div class="grow"><div class="row"><span class="row-title trunc">${esc(baseName(it.input))}</span>
          ${gone ? '<span class="pill">Moved or deleted</span>' : ""}${ok && it.files[0] && it.files[0].exists ? `<button class="btn ghost sm" data-act="edit-srt" data-path="${esc(it.files[0].path)}">Fix lines</button>` : ""}${ok && it.files.length > 1 ? `<span class="pill">${it.files.length} files</span>` : ""}</div>
        <div class="row-sub trunc">${time} · ${parts.join(" · ")}</div></div>
      ${ok && main && main.exists ? `<button class="iconbtn" data-act="reveal" data-path="${esc(main.path)}" title="Show in folder">${ICON.folder}</button>` : ""}
      ${it.input_exists ? `<button class="iconbtn" data-act="again" data-path="${esc(it.input)}" title="Make again">${ICON.again}</button>` : ""}
      <button class="iconbtn" data-act="forget" data-id="${esc(it.id)}" title="Remove from history">${ICON.x}</button>
    </div>`;
  };
  return top + groups.map(g => `<div class="block"><h2>${esc(g.label)}</h2><div class="grp">${g.items.map(row).join("")}</div></div>`).join("");
}
