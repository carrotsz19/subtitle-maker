/* Settings > Hardware: a simple choice first (three presets side by side, and what the chosen one
   does), the details after (each limit, folded away unless they're your own). Every limit is
   enforced by app.py and make_subtitles.py (see hardware.py); nothing here is a wish. */
const HW_PRESETS = [
  ["share", "Share nicely", "Other apps go first"],
  ["full", "Full speed", "All it can, as before"],
  ["light", "Light", "A quarter of the processor"],
];
/* "Use less graphics memory" changes something on this PC (an NVIDIA card with fast float16) */
const hwLowMem = () => !!(S.info.hardware.gpu && S.info.hardware.gpu_low_memory);
/* The preset the settings are, else "custom" (as hardware.preset_of; where "Use less graphics
   memory" changes nothing, it's left out, so Light stays Light either way) */
function hwPreset(st) {
  const presets = (S.info.hw || {}).presets || {};
  return Object.keys(presets).find(k => Object.entries(presets[k]).every(([key, v]) => (key === "gpu_low_memory" && !hwLowMem()) || st[key] === v)) || "custom";
}
function hwStatus(st) {
  const p = hwPreset(st);
  return {
    share: "Other apps get the processor first, so it's about as fast, and a little slower while they're busy. No limits.",
    full: "Uses all the processor it can and doesn't step aside for other apps, the way earlier versions did.",
    light: `Up to a quarter of the processor${hwLowMem() ? ", and less graphics memory" : ""}, so videos take longer.`
      + (S.info.hardware.gpu ? " When the graphics card is used, it still works at full speed." : ""),
    custom: "Your own limits, set below.",
  }[p];
}
const DEVICE_NOTE = { cpu: "Processor only", cuda: "Graphics card only" };
/* The Settings row: the preset's name, else what's limited; and the processor or graphics card if
   it isn't Automatic */
function hwSummary(st) {
  const p = hwPreset(st), parts = [];
  if (p !== "custom") parts.push(HW_PRESETS.find(([k]) => k === p)[1]);
  else {
    if (st.cpu_percent < 100) parts.push(`Up to ${st.cpu_percent}% processor`);
    if (st.memory_limit_gb) parts.push(`${st.memory_limit_gb} GB memory`);
    if (!parts.length) parts.push("Custom");
  }
  if (DEVICE_NOTE[st.device] && S.info.hardware.gpu) parts.push(DEVICE_NOTE[st.device]);
  return parts.join(" · ");
}
/* Memory limits worth offering on this PC: a few below what it has */
function memOptions() {
  const ram = S.info.hardware.ram_gb || 16, now = S.info.settings.memory_limit_gb;
  const sizes = [2, 4, 8, 16, 32].filter(g => g < ram);
  if (now && !sizes.includes(now)) sizes.push(now);
  return [[0, "No limit"], ...sizes.sort((a, b) => a - b).map(g => [g, `${g} GB`])];
}
/* Where a level runs, and about how much memory a video takes there (hardware.py works it out
   the same way for the check before starting, with the same 5% to spare) */
function runsOn(level, st = S.info.settings) {
  const hw = S.info.hardware;
  if (st.device === "cpu" || !hw.gpu) return "cpu";
  if (st.device === "cuda") return "cuda";
  return (hw.vram_mb || 0) - 500 >= S.info.levels[level].vram_mb ? "cuda" : "cpu";
}
function needMb(level, speakers) {
  const h = S.info.hw || {};
  return S.info.levels[level].ram_mb[runsOn(level)] + (speakers && level !== "potato" ? h.speakers_mb || 0 : 0) + (h.audio_mb || 0);
}
const MEMORY_TOLERANCE = 1.05;  // the same as hardware.MEMORY_TOLERANCE
const overLimit = (level, speakers, st = S.info.settings) => st.memory_limit_gb && needMb(level, speakers) > st.memory_limit_gb * 1024 * MEMORY_TOLERANCE;
const WARN_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5v.01"/></svg>';
/* Settings > Quality: a level that won't fit in the memory limit, or that the processor limit makes slow */
function levelLimitNote(level) {
  const st = S.info.settings, notes = [];
  if (overLimit(level, S.multi))
    notes.push(`Needs about ${gb(needMb(level, S.multi))} GB, more than your ${st.memory_limit_gb} GB memory limit`);
  else if (st.cpu_percent < 100 && runsOn(level) === "cpu")
    notes.push(`Slower with your processor limit (up to ${st.cpu_percent}%)`);
  return notes.map(n => `<div class="lv-warn">${WARN_ICON}<span>${esc(n)}.</span></div>`).join("");
}
function pageHardware() {

  const open = preset === "custom" || S.hwMore;
  return `

    <details class="block hw-more" data-act="hw-more" ${open ? "open" : ""}><summary>Set each limit: processor, memory and graphics card</summary>
      <div class="hw-more-body">

          ${prefRow("Processor", cpuSub, segPref("cpu_percent"), "cpu_percent")}

        </div></div>
      <div class="block"><h2>Memory</h2><div class="grp">

      <div class="block"><h2>Graphics card</h2><div class="grp">

          ${hw.gpu ? prefRow("Use less graphics memory", lowMem ? "Stores the speech model in a smaller format: about half the graphics memory, for almost the same accuracy."
            : "Needs a newer NVIDIA graphics card (one with fast float16, from the RTX 20 series). This one already uses its smallest format.", lowMem ? switchPref("gpu_low_memory") : `<button class="switch" role="switch" aria-checked="false" aria-labelledby="pt-gpu_low_memory" aria-describedby="ps-gpu_low_memory" disabled><span></span></button>`, "gpu_low_memory") : ""}
        </div>
        <p class="foot">${hw.gpu ? "While it's used, a graphics card always works at full speed: Windows can't hold it back, so there's no limit for that. To keep it free, choose Processor." : "Speaker names always run on the processor."}</p></div>
      </div></details>`;
}
/* While a video is being made: what Subtitle Maker itself uses, against its limits (and the
   graphics card's memory, for the whole card) */
function hwLive() {
  const res = (S.run && S.run.res) || {}, st = S.info.settings;
  if (res.app_cpu == null) return `<p class="hw-note">Measuring…</p>`;
  const cpuLim = res.cpu_limit, ramLim = res.ram_limit;
  const meter = (key, label, value, of, frac) => `<div class="meter${frac > .9 ? " hot" : ""}"><span>${label}</span><b>${value}${of ? ` <small>of ${of}</small>` : ""}</b>
      <div class="bar thin" data-bar="${key}" style="--p:${Math.min(1, frac || 0).toFixed(2)}"><i></i></div></div>`;
  // The limits this video runs under are the ones it started with; changed since, say so
  const changed = (cpuLim || null) !== (st.cpu_percent < 100 ? st.cpu_percent : null) || (ramLim || null) !== (st.memory_limit_gb * 1024 || null);
  return `<div class="hw-live">
      ${meter("hw-cpu", cpuLim ? "Processor" : "Processor (whole PC)", Math.round(res.app_cpu) + "%", cpuLim ? cpuLim + "%" : "100%", res.app_cpu / (cpuLim || 100))}
      ${meter("hw-mem", "Memory", gb(res.app_ram) + " GB", gb(ramLim || res.ram_total) + " GB", res.app_ram / (ramLim || res.ram_total))}
      ${res.vram_total ? meter("hw-vram", "Graphics memory (whole card)", gb(res.vram_used) + " GB", gb(res.vram_total) + " GB", res.vram_used / res.vram_total) : ""}
    </div>
    <p class="hw-note">What Subtitle Maker is using for this video${cpuLim || ramLim ? ", against your limits" : ""}.${changed ? " It runs with the limits it started with; your changes apply from the next video." : ""}</p>`;
}

/* The same line-breaking as make_subtitles.py (greedy wrap, then as even as possible), to preview it */
function wrapLines(text, width) {
  const lines = []; let cur = "";
  for (const w of text.split(" ")) {
    if (!cur) cur = w; else if ((cur + " " + w).length <= width) cur += " " + w; else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines;
}
function evenLines(text, maxChars, maxLines) {
  if (text.length <= maxChars) return [text];
  for (let width = Math.floor(text.length / 2) + 1; width <= maxChars; width++) {
    const lines = wrapLines(text, width); if (lines.length <= maxLines) return lines;
  }
  return wrapLines(text, maxChars);
}
function previewCues(st) {
  const lab = st.speaker_labels === "name" ? "Alex: " : st.speaker_labels === "dash" ? "- " : "";
  // The label counts towards the line length, as in make_subtitles.py
  const fits = t => wrapLines(lab + t, st.max_chars).length <= st.max_lines;
  const cues = []; let cur = [];
  for (const w of PREVIEW_TEXT.split(" ")) {
    if (cur.length && !fits([...cur, w].join(" "))) {
      // Like make_subtitles.py: break after a comma in the back half, so a short tail isn't left alone
      let comma = -1; cur.forEach((x, i) => { if (x.endsWith(",")) comma = i; });
      const cut = comma >= Math.floor(cur.length / 2) ? comma + 1 : cur.length;
      cues.push(cur.slice(0, cut).join(" ")); cur = cur.slice(cut);
    }
    cur.push(w);
  }
  if (cur.length) cues.push(cur.join(" "));
  return cues.map(c => evenLines(lab + c, st.max_chars, st.max_lines));
}

function versionText(v) {

}

/* What's new: each version's changes from CHANGELOG.md. After an update it opens once by itself
   with the versions since the last one opened; Settings > Updates shows them all. */
function newsHtml(text) {
  return esc(text).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
}
/* One change: "**Undo when fixing lines.** Ctrl+Z and..." becomes a heading and a line under it */
function newsItem(text) {
  const m = /^\*\*(.+?)\*\*\s*(.*)$/.exec(text);
  if (!m) return `<div class="nv-item plain">${newsHtml(text)}</div>`;
  return `<div class="nv-item"><b>${esc(m[1].replace(/[.:]$/, ""))}</b>${m[2] ? `<span>${newsHtml(m[2])}</span>` : ""}</div>`;
}
/* "31 October 2026" -> "31 Oct 2026" */
const shortDate = d => (d || "").replace(/^(\d+ )(\w{3})\w*( \d{4})$/, "$1$2$3");
async function showNews(list, fresh) {
  if (!list) {
    try { list = await api().all_news(); } catch (e) { list = []; }
  }
  if (!list.length) return toast("There's no list of changes in this copy of Subtitle Maker.", true);
  // Oldest at the top, newest at the bottom (CHANGELOG.md lists them newest first)
  const versions = [...list].reverse(), installed = S.info.release || list[0].version;
  const title = fresh ? `Updated to ${esc(list[0].version)}` : "What's new";
  const sub = fresh ? (list.length > 1 ? `Everything from the last ${list.length} versions` : "Here's what changed")
    : `You have ${esc(installed)}${(list.find(v => v.version === installed) || {}).date ? ` · ${esc(shortDate(list.find(v => v.version === installed).date))}` : ""}`;
  const version = v => {
    const current = v.version === installed;
    // Everything new to you stays open; in the full list, versions before yours are folded away
    const open = fresh || current || versions.indexOf(v) >= versions.findIndex(x => x.version === installed);
    const items = `<div class="nv-items">${v.changes.map(newsItem).join("")}</div>`;
    return `<section class="nv${current ? " current" : ""}">
      <div class="nv-title"><span class="v">${esc(v.version)}</span>${current ? '<span class="pill accent">Installed</span>' : ""}
        <span class="d">${esc(shortDate(v.date))}</span></div>
      ${open ? items : `<details><summary><span class="when-shut">Show ${v.changes.length} change${v.changes.length === 1 ? "" : "s"}</span><span class="when-open">Hide</span></summary>${items}</details>`}</section>`;
  };
  $("#dialog-root").innerHTML = `
    <div class="scrim"><div class="dialog news-sheet" role="dialog" aria-modal="true" aria-labelledby="nw-title">
      <div class="nv-head"><div class="tile-icon">${ICON.gift}</div>
        <div class="grow"><h3 id="nw-title">${title}</h3><div class="sub">${sub}</div></div></div>
      <div class="nv-body" id="nw-body"><div class="timeline">${versions.map(version).join("")}</div></div>
      <div class="nv-foot"><button class="btn" id="nw-done" data-dismiss>${fresh ? "Got it" : "Done"}</button></div>
    </div></div>`;
  // Open at the newest (at the bottom), with its heading at the top of the view
  const body = $("#nw-body"), newest = body.querySelector(".nv:last-child");
  body.scrollTop = newest.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop - 8;
  $("#nw-done").onclick = () => {
    closeDialogs();
    if (fresh) api().news_seen();
  };
}

  if (d.switch === "main") return "Puts back the stable version, the one everybody gets. Anything only the experimental version had goes away.";

          `<button role="radio" data-act="channel" data-v="${v}" data-arrow="move" aria-checked="${ch === v}" ${locked ? "disabled" : ""}>${l}</button>`).join("")}</div></div>
      ${body}</div></div>`;

async function checkUpdate(quiet) {
  const sheet = S.update.sheet, locked = S.update.blocking, deferred = S.update.deferred;
  S.update = { state: "checking", sheet, blocking: locked, deferred };
  if (S.view === "settings") render();
  renderUpdateSheet();
  const r = await api().check_update(), blocking = locked;
  if (r.error) S.update = { state: quiet && !sheet && !blocking ? "idle" : "error", error: r.error, sheet: sheet || blocking, blocking, deferred };
  else S.update = { state: r.update ? "available" : "ok", data: r, sheet, blocking: !!r.required };
  if (S.update.blocking) return lockForUpdate();
  // Automatic checks off: a quiet check keeps everything but a security update to itself
  if (quiet && r.update && r.kind !== "security" && !S.info.settings.auto_update) S.update = { state: "idle" };
  // A security update doesn't wait to be noticed
  if (quiet && r.update && r.kind === "security" && !S.run && !S.setup) S.update.sheet = true;
  render();
  renderUpdateSheet();
}

/* What kind of update: the most serious waiting change decides how much it speaks up */
const UPDATE_KINDS = {
  critical: { pill: "Critical", cls: "bad", banner: "An important security update has to be installed.", title: "Important security update" },
  security: { pill: "Security", cls: "bad", banner: "A security update is ready. Please install it.", title: "Security update ready" },
  hotfix: { pill: "Fix", cls: "accent", banner: "An important fix is ready.", title: "An important fix is ready" },
  feature: { pill: "New", cls: "ok", banner: "New features are ready.", title: "New features are ready" },
  improvement: { pill: "Improved", cls: "", banner: "A new version is ready.", title: "A new version is ready" },
};

function updateBanner(kind) {
  const k = UPDATE_KINDS[kind] || UPDATE_KINDS.improvement;
  return `<div class="banner between${kind === "security" ? " bad" : ""}"><span>${k.banner}</span>
      <button class="btn sm${kind === "security" ? " dan" : ""}" data-act="open-update">${kind === "security" ? "Update now" : "See what's new"}</button></div>`;
}

function newsList(news, more) {
  return `<div class="newslist">${(news || []).map(n => {
    const k = UPDATE_KINDS[n.kind] || UPDATE_KINDS.improvement;
    return `<div class="news"><span class="pill ${k.cls}">${k.pill}</span><span>${esc(n.text)}</span></div>`;
  }).join("")}${more ? `<div class="sm dim">…and ${more} smaller change${more > 1 ? "s" : ""}</div>` : ""}</div>`;

          </div></div>${nav("wiz-download", "Download and finish")}`;
      break;
    case 4: {
      const running = S.run && S.run.kind === "prepare";
      body = `<div class="wiz-body"><h1>${w.error ? "The download stopped" : "Getting things ready"}</h1>
          <p class="lede">${w.error ? "Nothing is lost: what finished is kept, and Retry picks up the rest." : "First time only. After this, Subtitle Maker works offline."}</p>
          <div id="downloads">${downloadRows(w.level)}</div>
          ${w.error ? `<div class="banner bad selectable" style="margin-top:14px">${esc(w.error)}</div>` : ""}</div>
        <div class="wiz-nav"><button class="btn sec" data-act="wiz-back" ${running ? "disabled" : ""}>Back</button><div class="grow"></div>
          ${w.error ? `<button class="btn" data-act="wiz-download">Retry</button>` : `<button class="btn" disabled>Downloading…</button>`}</div>`;
      break;
    }
    default:
      body = `<div class="wiz-body"><div class="success" style="width:64px;height:64px;margin-bottom:18px">${ICON.check}</div>
          <h1>You're all set</h1>
          <p class="lede">Drop a video on the next screen and you'll get a .srt to import into Resolve (File › Import › Subtitle).</p>
          <div class="card stack sm">
            <div class="row"><span class="tile-icon t-accent">${ICON.srt}</span><span>${S.info.version ? "Open Subtitle Maker any time from the <b>Subtitle Maker</b> shortcut on your desktop."
              : "Open Subtitle Maker any time with <b>Subtitle Maker.bat</b> in its folder."}</span></div>
            <div class="row"><span class="tile-icon t-accent">${ICON.person}</span><span>Several people talking? Pick "Several people" and it names who's speaking.</span></div>
          </div></div>${nav("wiz-finish", "Start making subtitles", false)}`;
  }
  return `<div class="wiz">${steps}${body}</div>`;
}

async function setupDownload() {
  const w = S.setup;
  const lang = w.language === "other" ? null : w.language;
  S.info.settings = await api().save_settings(w.level, lang);
  S.info.settings = await api().set_output_dir(w.output_dir || null);
  S.info.configured = true;
  w.error = null;
  w.step = 4;
  if (neededFor(w.level).every(i => i.have)) { w.step = 5; render(true); return; }
  startPrepare(w.level, (ok, error) => {
    if (ok) w.step = 5; else w.error = error || "The download didn't finish. Check your internet connection.";
    render(true);
  });
  render(true);
}

/* ---------------------------------------------------------------------
   Updating: a sheet that walks through the steps
--------------------------------------------------------------------- */
/* An important security update: nothing can be used until it's installed. A video that's
   already running finishes first (no work is lost); nothing new starts. */
function lockForUpdate() {
  S.update.blocking = true;
  if (S.run) { render(); return; }  // the banner says it's coming; next() shows the lock after this video
  S.update.sheet = true;
  if (!S.update.data && S.update.state !== "checking" && S.update.state !== "error") return checkUpdate(false);
  renderUpdateSheet();
}

function openUpdate() {
  S.update.sheet = true;
  if (S.update.state === "idle" || S.update.state === "error") checkUpdate(false);
  else renderUpdateSheet();
}

function renderUpdateSheet() {
  const u = S.update, root = $("#dialog-root");
  if (!u.sheet) return;
  const d = u.data || {}, p = u.progress || {};
  const step = (key, title, detail, i) => {
    const order = ["download", "install", "done"], at = order.indexOf(u.current || "download");
    const state = u.state === "installed" ? (i < 2 ? "done" : "active") : at > i ? "done" : at === i ? "active" : "";
    // a tick pops once, when its step finishes, not on every redraw of the progress
    const ticked = u.ticked || (u.ticked = {}), just = state === "done" && !ticked[key];
    if (state === "done") ticked[key] = true;
    return `<div class="step ${state}${just ? " just" : ""}"><span class="dot">${state === "done" ? ICON.tick : i + 1}</span>
      <div class="grow"><b>${title}</b>${state === "active" && detail ? `<div class="sm dim mono" style="margin:2px 0 6px">${detail.text}</div>
        <div class="bar thin${detail.frac == null ? " indeterminate" : ""}" data-bar="update-${key}" style="--p:${detail.frac || 0}"><i></i></div>` : ""}</div></div>`;
  };
  let body, actions;
  const lockNote = `<div class="banner bad">This version has a security problem, so it can't be used until it's updated.${
    u.blocking && (d.required || S.info.required) ? `<br><b>${esc((d.required || S.info.required).text || "")}</b>` : ""}</div>`;
  switch (u.state) {
    case "checking":
      body = `${u.blocking ? lockNote : ""}<div class="row dim"><div class="bar indeterminate grow"><i></i></div><span class="sm">Checking GitHub…</span></div>`;
      actions = u.blocking ? "" : `<button class="btn sec" data-up="close">Close</button>`; break;
    case "ok":
      body = `<div class="row"><span class="pill ok">Up to date</span><span class="sm dim">You have the latest version (${esc(installedText())}).</span></div>`;
      actions = `<button class="btn" data-up="close">Done</button>`; break;
    case "available":
      body = `${u.blocking ? lockNote : ""}<div class="between"><span class="sm dim">${d.switch ? "Version" : "New version"}</span><span class="sm dim mono">${esc(versionText(d.latest))}</span></div>
        ${d.switch ? `<p>${switchNote(d)}</p>` : ""}
        ${d.switch === "main" ? "" : `<div><h2 style="margin-left:0">What's new</h2>${newsList(d.news, d.more)}</div>`}
        <p class="sm dim">Takes about a minute. Your voice clips, settings, models and history are kept.</p>`;
      actions = u.blocking ? `<button class="btn" data-up="install">Update now</button>`
        : S.run ? `<span class="sm dim note">You can update once the current video is finished.</span><button class="btn sec" data-up="close">Later</button>`
        : `<button class="btn sec" data-up="close">Later</button><button class="btn" data-up="install">${d.switch ? "Switch now" : "Update now"}</button>`; break;
    case "installing": case "installed": {
      const dl = p.download || {}, ins = p.install || {};
      body = `<div class="steplist">
          ${step("download", "Download the new version", { text: dl.done != null ? `${dl.done.toFixed(1)}${dl.total ? " of " + dl.total.toFixed(1) : ""} MB` : "Starting…", frac: dl.total ? dl.done / dl.total : null }, 0)}
          ${step("install", "Install it", { text: ins.total ? `${ins.done} of ${ins.total} files` : "", frac: ins.total ? ins.done / ins.total : null }, 1)}
          ${step("done", u.packages ? "Restart (and add new parts)" : "Restart", null, 2)}
        </div>
        ${u.state === "installed" ? `<p class="sm dim">${u.packages ? "This update needs new parts, so a small window shows them installing while it restarts (a minute or two)."
          : "Restart to start using the new version."}</p>` : ""}`;
      actions = u.state === "installed" ? `${u.blocking ? "" : `<button class="btn sec" data-up="close">Later</button>`}<button class="btn" data-up="restart">Restart now</button>`
        : `<button class="btn" disabled>Updating…</button>`; break;
    }
    default:
      body = `${u.blocking ? lockNote : ""}<div class="banner bad selectable">${esc(u.error || "Something went wrong.")}</div>`;
      // Locked but GitHub can't be reached: being offline is no risk, so it can be used until it's back
      actions = `${u.blocking ? `<button class="btn sec" data-up="offline">Keep using it offline</button>` : `<button class="btn sec" data-up="close">Close</button>`}<button class="btn" data-up="retry">Try again</button>`;
  }
  const inside = `<div class="row"><div class="tile-icon t-accent">${ICON.again}</div><h3 id="up-title">${
        u.blocking && !["installing", "installed"].includes(u.state) ? "Important security update" : { checking: u.blocking ? "Important security update" : "Checking for updates", ok: "Subtitle Maker is up to date",
          available: u.blocking ? "Important security update" : updateTitle(d), installing: "Updating Subtitle Maker",
          installed: "Update installed" }[u.state] || "The update didn't work"}</h3></div>
      ${body}<div class="dlg-foot">${actions}</div>`;
  // Redrawn while it's open (progress, or the check coming back): the backdrop and the window stay
  // the ones they are and only what's inside changes, so it never opens again, and one caught
  // still opening simply carries on. The ✕ is kept (or added, or taken away, with the button that
  // closes it), the focus goes back inside, and the progress bar moves on from where it was.
  const box = root.querySelector("#update-sheet:not(.is-closing) > .dialog");
  if (box) {
    const x = box.querySelector(".dlg-x"), bars = barsNow(box);
    box.classList.toggle("blocking", !!u.blocking);
    box.innerHTML = inside;
    sheetX(box, x);
    barsCarry(box, bars);
    sheetFocus(box);
  } else root.innerHTML = `<div class="scrim" id="update-sheet"><div class="dialog stack${u.blocking ? " blocking" : ""}" role="dialog" aria-modal="true" aria-labelledby="up-title">${inside}</div></div>`;
  root.querySelectorAll("[data-up]").forEach(b => b.onclick = () => UPDATE_ACTIONS[b.dataset.up]());
}

const UPDATE_ACTIONS = {
  close: () => { if (S.update.blocking) return; S.update.sheet = false; closeDialogs(); if (S.view === "settings") render(); },
  retry: () => checkUpdate(false),
  // The lock lifts until the next check that reaches GitHub (every start, and the banner's Try again)
  offline: () => { S.update = { state: "idle", deferred: true }; closeDialogs(); render(); },
  install: async () => {
    if (!S.update.data) return checkUpdate(false);  // locked while offline: find the version first
    if (!await api().install_update(S.update.data.latest)) return toast("Wait for the current video to finish.", true);
    Object.assign(S.update, { state: "installing", current: "download", progress: {} });
    renderUpdateSheet();
  },
  restart: () => api().restart(),
};

function showAsk(ev) {

  const bars = Array.from({ length: 48 }, (_, i) => `<i style="height:${Math.round(20 + 80 * Math.abs(Math.sin(i * 1.7) * Math.cos(i * .45)))}%"></i>`).join("");

      <div><h3 id="ask-title">Who is ${esc(ev.label)}?</h3>

      <div class="player"><button class="playbtn" id="ask-play" aria-label="Play">${ICON.play}</button>
        <div class="wave" id="ask-wave">${bars}</div><span class="sm dim mono" id="ask-time">0:00</span></div>
      <audio id="ask-audio" src="${ev.clip}" preload="auto"></audio>
      <div><h2 style="margin-left:0">Their longest lines</h2>
        ${ev.lines.map(l => `<div class="quote"><span class="t">${clock(l.start)}</span><span class="selectable">“${esc(l.text)}”</span></div>`).join("")}</div>
      <div><input type="text" id="ask-name" placeholder="Their name" autocomplete="off" maxlength="40" autofocus>
        ${voices.length ? `<div class="chips" style="margin-top:8px">${voices.map(v => `<button class="chip" data-name="${esc(v)}">${esc(v)}</button>`).join("")}</div>` : ""}</div>
      <div class="dlg-foot"><button class="btn sec" id="ask-keep" data-dismiss>Keep “${esc(ev.label)}”</button>
        <button class="btn" id="ask-save">Save name</button></div>
    </div></div>`;
  const audio = $("#ask-audio"), play = $("#ask-play"), bars_ = [...document.querySelectorAll("#ask-wave i")];
  const sync = () => {
    if (!audio.isConnected) return;  // a late pause/timeupdate after the dialog closed
    play.innerHTML = audio.paused ? ICON.play : ICON.pause;
    const f = audio.duration ? audio.currentTime / audio.duration : 0;
    bars_.forEach((b, i) => b.classList.toggle("on", i / bars_.length < f));
    $("#ask-time").textContent = clock(audio.currentTime);
  };
  ["play", "pause", "timeupdate", "ended"].forEach(e => audio.addEventListener(e, sync));
  play.onclick = () => audio.paused ? audio.play() : audio.pause();
  audio.play().catch(() => {});
  const send = name => { audio.pause(); api().answer(name); closeDialogs(); S.ask = null; };
  $("#ask-save").onclick = () => send($("#ask-name").value.trim());

  $("#ask-name").onkeydown = e => { if (e.key === "Enter") send(e.target.value.trim()); };
  document.querySelectorAll("#dialog-root .chip").forEach(c => c.onclick = () => { $("#ask-name").value = c.dataset.name; $("#ask-name").focus(); });
}

/* A confirmation: the question, what happens, and the action named by its verb (red only when

const DESTRUCTIVE = /^(delete|remove|forget|discard|reset|clear|uninstall)\b/i;

        <button class="btn${bad ? " dan" : ""}" id="cf-yes">${esc(action)}</button></div>

  const close = () => { closeDialogs(); };
  $("#cf-no").onclick = close;
  $("#cf-yes").onclick = () => { close(); onYes(); };

/* ---------------------------------------------------------------------
   Actions
--------------------------------------------------------------------- */
function bind(root) {
  root.querySelectorAll("[data-act]").forEach(el => {
    const handler = ACTIONS[el.dataset.act];
    if (!handler) return;
    if (el.tagName === "DETAILS") { el.addEventListener("toggle", () => handler(el)); return; }
    el.onclick = e => { e.stopPropagation(); handler(el); };
    const role = el.getAttribute("role");
    if (role === "button" || role === "radio") el.onkeydown = e => {
      // (a real button clicks itself on Enter and Space)
      if ((e.key === "Enter" || e.key === " ") && el.tagName !== "BUTTON") { e.preventDefault(); handler(el); return; }
      // The arrow keys walk a group of radios (a list, or a segmented control), picking as they
      // go, as radio buttons do. One that opens something or changes much (In one folder, More…,
      // the version to follow) is only moved to: Enter or Space picks it.
      const step = role === "radio" && !e.ctrlKey && !e.altKey && !e.metaKey && { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
      if (!step) return;
      const all = [...(el.closest('[role="radiogroup"]') || root).querySelectorAll('[role="radio"]')].filter(r => !r.disabled);
      const to = all[(all.indexOf(el) + step + all.length) % all.length];
      if (!to || to === el) return;
      e.preventDefault();
      all.forEach(r => { r.tabIndex = r === to ? 0 : -1; });
      to.focus();
      if (to.dataset.v != null && to.dataset.arrow !== "move" && ACTIONS[to.dataset.act]) ACTIONS[to.dataset.act](to);
    };
  });
  roving(root);
  syncSegs(root);
  if (S.review) bindReview(root);
  const hot = $("#hotwords", root);
  if (hot) hot.onchange = async () => { S.info.settings = await api().save_prefs({ hotwords: hot.value.trim() }); toast("Saved."); };
  const wizCode = $("#wiz-code", root);
  if (wizCode) wizCode.onchange = () => { S.setup.language = wizCode.value || "other"; };
  const code = $("#lang-code", root);
  if (code) code.onchange = () => { S.draft.language = code.value || "other"; updateSave(); };
}

/* A group of radios is one stop for Tab: the chosen one (or the first, when none is), and the
   arrow keys move within it */
function roving(root) {
  root.querySelectorAll('[role="radiogroup"]').forEach(group => {
    const items = [...group.querySelectorAll('[role="radio"]')], usable = items.filter(r => !r.disabled);
    const stop = usable.find(r => r.getAttribute("aria-checked") === "true") || usable[0];
    items.forEach(r => { r.tabIndex = r === stop ? 0 : -1; });
  });
}

function updateSave() {
  const b = $('[data-act="save"]');
  if (b) b.disabled = S.draft.language === "other" || (S.info.configured && S.draft.level === S.info.settings.level && S.draft.language === S.info.settings.language);
}

const ACTIONS = {
  "rv-play-spk": el => {
    // Their longest line is the clearest few seconds of their voice
    const r = S.review, k = el.dataset.k;
    let best = -1;
    r.cues.forEach((c, i) => { if (!c.gone && String(c.speaker) === k && (best < 0 || c.end - c.start > r.cues[best].end - r.cues[best].start)) best = i; });
    if (best < 0) return toast(`${r.names[k] || `Speaker ${+k + 1}`} has no lines left.`, true);
    const btn = document.querySelector(`.rv-row[data-i="${best}"] .rv-play`);
    if (!btn) return;
    btn.closest(".rv-row").scrollIntoView({ block: "nearest", behavior: prefersReducedMotion() ? "auto" : "smooth" });
    ACTIONS["rv-play"](btn);
  },
  "rv-add-person": () => {
    rvSnap("person"); rvUndoButtons();
    const k = rvNewPerson();
    rvUpdateNames();
    rvFocusName(k);
    toast("Name them, then pick them in the speaker box on their lines.");
  },
  "rv-play": async el => {
    const c = S.review.cues[+el.dataset.i];
    document.querySelectorAll(".rv-row.playing").forEach(x => x.classList.remove("playing"));
    el.closest(".rv-row").classList.add("playing");
    if (S.review.mode !== "file") return api().review_clip(+el.dataset.i, c.start, c.end);
    if (!S.review.video) { el.closest(".rv-row").classList.remove("playing"); return toast("There's no video with the same name next to this file, so there's nothing to play.", true); }
    const data = await api().edit_clip(c.start, c.end);
    if (!data) { el.closest(".rv-row").classList.remove("playing"); return toast("Couldn't play that part of the video.", true); }
    app.onEvent({ type: "clip", data });
  },
  "rv-timing": el => { const i = +el.dataset.i; S.review.timing = S.review.timing === i ? null : i; render(); },
  "rv-nudge": el => {
    const i = +el.dataset.i, key = el.dataset.k, c = S.review.cues[i];
    rvSnap("time");
    rvSetTime(i, key, c[key] + parseFloat(el.dataset.d));
    render();

  "rv-split": el => {
    const r = S.review, i = +el.dataset.i, c = r.cues[i], text = c.text.trim();
    let at = r.caret && r.caret.i === i ? r.caret.pos : -1;
    if (at <= 0 || at >= text.length) {
      // No cursor in this line: the space nearest the middle
      const spaces = [...text.matchAll(/ /g)].map(m => m.index);
      if (!spaces.length) return toast("A single word can't be split.", true);
      at = spaces.reduce((best, x) => Math.abs(x - text.length / 2) < Math.abs(best - text.length / 2) ? x : best);
    }
    const left = text.slice(0, at).trim(), right = text.slice(at).trim();
    if (!left || !right) return toast("Put the cursor where the line should be split.", true);
    // The time is shared out by length, which is close to how long each part takes to say
    const cut = Math.round((c.start + (c.end - c.start) * left.length / (left.length + right.length)) * 100) / 100;
    rvSnap("split", i);
    r.cues.splice(i, 1, { ...c, text: left, end: cut }, { ...c, text: right, start: cut, uid: ++rvUid });  // the second half is a new line
    r.timing = null; r.caret = null;
    render();

    rvSnap("join", i);
    r.cues.splice(i, 2, { ...c, text: `${c.text.trim()} ${next.text.trim()}`, end: next.end });
    r.timing = null; r.caret = null;
    render();

/* Starts the next waiting file, if nothing is running. */
function next() {
  if (S.run) return;
  if (S.update.blocking) { lockForUpdate(); render(); return; }
  const item = S.queue.find(q => q.status === "waiting");
  if (!item) {
    // Every video is transcribed: now they're checked, one after another, in queue order
    const check = S.queue.find(q => q.status === "check");
    if (check) {
      check.status = "checking";
      // Everything's transcribed and nothing more happens until someone's back: say so (once)
      if (S.announceChecks) { S.announceChecks = false; api().checks_ready(checksLeft() + 1); }
      S.run = { kind: "make", item: check, checking: true, done: 0, total: 0, stage: "Opening the lines to check", speakers: null, res: null, log: [], startedAt: null };
      api().finish(check.path, check.bundle);
      if (S.view === "make") render(); else renderSide();
      return;
    }
    // The whole queue is done: show where the subtitles went, if Settings says to
    const first = (S.batch || []).find(Boolean);
    if (first && S.info.settings.open_folder) api().reveal(first);
    const done = S.queue.filter(q => q.status === "done").length, failed = S.queue.filter(q => q.status === "failed").length;
    if (done + failed && (S.batch || []).length + failed) api().queue_finished(done, failed);
    S.batch = [];
    S.memChecked = false;  // the next queue is checked afresh
    render();
    return;
  }
  item.status = "working";
  const potato = S.info.settings.level === "potato";
  const speakers = S.multi && !potato ? S.people : null;
  S.run = { kind: "make", item, done: 0, total: 0, stage: "Loading the model", speakers: null, res: null, log: [], startedAt: null };
  // With checking on, each video is only transcribed now and checked once the queue is done,
  // so nobody has to wait by the PC between videos
  api().start(item.path, speakers, !!S.info.settings.review);
  if (S.view === "make") render();
  else renderSide();
}

/* ---------------------------------------------------------------------
   Called from app.py
--------------------------------------------------------------------- */
const app = {
  async openSrt(path) {
    if (!S.info) { S.pendingSrt = path; return; }  // dropped on the icon: once the page is ready
    if (S.update.blocking) return lockForUpdate();
    if (S.run) return toast("Wait for the current video to finish first.", true);
    if (S.review) return toast("Save or close the lines you're checking first.", true);
    const r = await api().open_srt(path);
    if (r.error) return toast(r.error, true);
    S.review = { mode: "file", file: r.file, path: r.path, video: r.video, style: "none", max_chars: r.max_chars, max_lines: r.max_lines,
      names: {}, hasNames: false, cues: rvTag(r.cues), formatted: r.formatted };
    if (S.view !== "make") go("make", "in"); else render(true);
  },

  addFiles(paths) {
    let added = 0;
    for (const p of paths || []) {
      if (S.queue.some(q => q.path === p && (q.status === "waiting" || q.status === "working"))) continue;
      S.queue.push({ path: p, name: baseName(p), status: "waiting" });
      added++;
    }
    if (!added) return;
    // Mark the ones that already have subtitles (the new file won't replace them)
    const fresh = S.queue.filter(q => q.status === "waiting" && q.has_srt === undefined);
    api().queue_info(fresh.map(q => q.path)).then(info => {
      fresh.forEach(q => { q.has_srt = !!(info[q.path] && info[q.path].has_srt); });
      if (S.view === "make" && !S.review && fresh.some(q => q.has_srt)) render();
    });
    // A finished batch makes way for the new one
    if (!S.run) S.queue = S.queue.filter(q => q.status === "waiting" || q.status === "check");
    // Start loading the speech model while you pick the options, so the first video starts sooner
    if (!S.run) api().warm();
    if (S.view !== "make") go("make"); else render();
  },

  onEvent(ev) {
    if (ev.type === "update_progress") {
      const u = S.update;
      u.progress = u.progress || {};
      if (ev.step === "download" || ev.step === "install") { u.current = ev.step; u.progress[ev.step] = { done: ev.done, total: ev.total }; }
      renderUpdateSheet();
      return;
    }
    if (ev.type === "update_done") {
      Object.assign(S.update, ev.error ? { state: "error", error: ev.error } : { state: "installed", current: "done", packages: ev.packages });
      if (!S.update.sheet && !ev.error) toast("Updated. Restart the window to use it.");
      renderUpdateSheet();
      render();  // no video can be running during an update, so a full redraw is safe
      return;
    }
    const r = S.run;
    if (!r) return;
    switch (ev.type) {
      case "progress":
        if (ev.stage === "Transcribing" && !r.startedAt && ev.done === 0) r.startedAt = Date.now();
        // Speaker detection just finished: the processor is freed up, so measure the speed afresh
        if (r.speakers != null && r.speakers < 1 && ev.speakers === 1) r.rateFrom = Date.now();
        if (ev.done !== r.done) (r.points = r.points || []).push({ t: Date.now(), done: ev.done });
        if (r.points && r.points.length > 400) r.points.splice(0, 200);
        Object.assign(r, { done: ev.done, total: ev.total, stage: ev.stage, speakers: ev.speakers, expect: ev.expect,
          phase: ev.phase, overall: ev.overall, fetch: null });
        break;
      case "resources": r.res = ev; updateHwLive(); break;
      case "download":
        if (r.kind === "make") {
          r.stage = `${ev.item === "video" ? "Copying" : "Downloading"} ${ev.label}${ev.total ? ` · ${Math.round(ev.done)} of ${Math.round(ev.total)} MB` : ""}`;
          r.fetch = ev.total ? { item: ev.item, done: ev.done, total: ev.total } : null;  // the bar fills when the size is known
          break;
        }
        r.downloads[ev.item] = { done: ev.done, total: ev.total, finished: ev.total && ev.done >= ev.total };
        { const box = $("#downloads"); if (box) box.innerHTML = downloadRows(r.level); }
        return;
      case "log":
        r.log.push(ev.text);
        if (/^Reading the sound/.test(ev.text)) Object.assign(r, { stage: "Reading the video", fetch: null });
        if (/^Loading/.test(ev.text)) Object.assign(r, { stage: "Loading the model", fetch: null });
        if (/^Speaker detection on/.test(ev.text)) Object.assign(r, { stage: "Starting speaker detection", fetch: null });
        break;
      case "ask_speaker": showAsk(ev); return;
      case "review": {
        const names = Object.keys(ev.names).length ? ev.names : null;
        S.review = { file: ev.file, style: ev.style, max_chars: ev.max_chars, max_lines: ev.max_lines,
          names: names || {}, hasNames: !!names, cues: rvTag(ev.cues.map(c => ({ ...c }))) };
        if (S.view === "make") render(true); else toast("The subtitles are ready to check.");
        return;
      }
      case "clip": {
        if (S.player) S.player.pause();
        S.player = new Audio(ev.data);
        S.player.onended = () => document.querySelectorAll(".rv-row.playing").forEach(x => x.classList.remove("playing"));
        S.player.play().catch(() => {});
        return;
      }
      case "pending":  // transcribed; checked once the rest of the queue is done
        if (r.item) Object.assign(r.item, { status: "check", bundle: ev.bundle, file: ev.file });
        S.announceChecks = true;
        break;
      case "discarded":
        if (r.item) r.item.status = "discarded";
        break;
      case "done":
        if (r.item) { r.item.status = "done"; r.item.files = ev.files; (S.batch = S.batch || []).push(ev.files[0] && ev.files[0].path); }
        break;
      case "error":
        if (r.item) { r.item.status = "failed"; r.item.error = ev.message; r.item.log = ev.log; r.item.memory = !!ev.memory; }
        else if (r.after) r.error = ev.message;
        else toast(ev.message, true);
        break;
      case "exit": {
        // A check that's cancelled keeps the video "To check": its lines are still kept on disk
        if (r.item && r.item.status === "checking" && ev.cancelled) r.item.status = "check";
        else if (r.item && (r.item.status === "working" || r.item.status === "checking")) r.item.status = ev.cancelled ? "cancelled" : "failed";
        if (r.kind === "prepare") {
          S.run = null;
          S.models = null;
          api().models_status().then(m => { S.info.models = m; if (r.after) r.after(!ev.code, r.error); else render(); });
          return;
        }
        // (History on screen keeps its list until the new one is in, so it doesn't empty and jump to the top)
        if (r.kind === "make") { S.voicesKnown = null; if (S.view === "history") loadHistory(); else S.history = null; }
        S.run = null;
        S.review = null;
        closeDialogs();
        S.ask = null;
        if (ev.cancelled || S.cancelAll) {
          S.queue = S.queue.filter(q => q.status !== "cancelled");
          S.cancelAll = false;
          render();
          toast("Stopped.");
          return;
        }
        next();
        return;
      }
    }
    if (S.view === "make" && r.kind === "make") patchRunning();

  },
};

/* Re-render the running card without re-binding the whole page. */
function patchRunning() {
  const card = $("#running");
  if (!card) return render();
  const tmp = document.createElement("div");
  tmp.innerHTML = viewRunning();
  const fresh = tmp.firstElementChild;
  // The main bar slides back and forth until a length is known; stop that once it is. A bar for
  // something else (the copy before, the video after) comes in fresh instead of gliding over.
  const bar = card.querySelector(".bar"), freshBar = fresh.querySelector(".bar");
  if (bar.dataset.bar !== freshBar.dataset.bar) bar.replaceWith(freshBar.cloneNode(true));
  else bar.classList.toggle("indeterminate", freshBar.classList.contains("indeterminate"));
  // Keep the log's open state and scroll, and move the bars on from where they are
  card.querySelectorAll(".bar").forEach((old, i) => {
    const nu = fresh.querySelectorAll(".bar")[i];
    if (nu) old.style.setProperty("--p", nu.style.getPropertyValue("--p"));
  });
  ["#run-pct", "#run-stage", "#run-spk"].forEach(sel => { const a = $(sel, card), b = $(sel, fresh); if (a && b) a.innerHTML = b.innerHTML; });
  const oldMeters = $(".meters", card), newMeters = $(".meters", fresh);
  if (newMeters && !oldMeters) $("details", card).before(newMeters);
  else if (oldMeters && newMeters) oldMeters.querySelectorAll(".meter").forEach((m, i) => {
    const n = newMeters.querySelectorAll(".meter")[i]; if (!n) return;
    m.querySelector("b").textContent = n.querySelector("b").textContent;
    m.className = n.className;
  });
  // Subtitle Maker's own share, under the meters
  const oldOwn = $("#run-own", card), newOwn = $("#run-own", fresh);
  if (oldOwn && newOwn) oldOwn.textContent = newOwn.textContent;
  else if (newOwn) $("details", card).before(newOwn);
  const spk = S.run.speakers != null;
  if (spk !== !!card.querySelector(".bar.ok")) return render();
  const log = $("#run-log", card);
  const stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  log.textContent = S.run.log.slice(-40).join("\n");
  if (stick) log.scrollTop = log.scrollHeight;
}

/* Opening a "Details" by hand fades in what it shows (a redraw that finds one already open shows
   it as it is). The click comes before the browser opens it, so this looks a frame later. */
document.addEventListener("click", e => {
  const summary = e.target.closest ? e.target.closest("summary") : null, box = summary && summary.parentElement;
  if (!box || box.tagName !== "DETAILS") return;
  requestAnimationFrame(() => {
    // (with less motion, the same short plain fade as everything else that appears)
    const calm = prefersReducedMotion();
    if (box.open) [...box.children].forEach(n => { if (n !== summary) n.animate([{ opacity: 0 }, { opacity: 1 }], calm ? { duration: 120, easing: "linear" } : { duration: 160, easing: "cubic-bezier(.16,1,.3,1)" }); });
  });
}, true);

/* Drag highlighting. app.py receives the drop itself, because only it can see full file paths. */
let dragDepth = 0;
document.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
document.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", () => { dragDepth = 0; document.body.classList.remove("dragging"); });

/* ---------------------------------------------------------------------
   Starting up: the loader says what's happening, and speaks up if it's slow or broken
--------------------------------------------------------------------- */
const BOOT = { stage: "connecting the window to Subtitle Maker", done: false };

function loaderSay(title, text) {
  $("#loader-title").textContent = title;
  $("#loader-text").textContent = text;
}

function loaderProblem(text, detail) {
  if (BOOT.done) return;
  const box = $("#loader");
  box.classList.add("problem");
  loaderSay("Subtitle Maker didn't start properly", text + (detail ? "\n\n" + detail : ""));
  const hasApi = !!(window.pywebview && window.pywebview.api);
  $("#loader-actions").innerHTML = `<button class="btn" id="ld-retry">Try again</button>
    ${hasApi ? `<button class="btn sec" id="ld-restart">Restart</button><button class="btn ghost" id="ld-log">Open the startup log</button>` : ""}`;
  $("#ld-retry").onclick = () => location.reload();
  if (hasApi) {
    $("#ld-restart").onclick = () => api().restart_app();
    $("#ld-log").onclick = () => api().open_startup_log();
  }
}

setTimeout(() => { if (!BOOT.done) loaderSay("Still starting…", "This can take a little longer the first time after installing or updating."); }, 8000);
setTimeout(() => loaderProblem(`It got stuck ${BOOT.stage}.`,
  "Try again usually fixes it. If it keeps happening, restart your PC, or run Setup.bat to repair."), 25000);

function loaderDone() {
  BOOT.done = true;
  const box = $("#loader");
  box.classList.add("gone");
  setTimeout(() => box.remove(), 400);
}

async function boot() {
  BOOT.stage = "loading your settings";
  try {
    S.info = await api().init();
  } catch (e) {
    return loaderProblem("It couldn't load your settings.", String(e && e.message || e));
  }
  BOOT.stage = "drawing the window";
  try { await startApp(); } catch (e) { return loaderProblem("Something went wrong while opening.", String(e && e.message || e)); }
  loaderDone();
}

async function startApp() {
  applyTheme();
  applyLessMotion();
  if (S.info.unfinished && S.info.unfinished.length && S.info.mode !== "setup") S.unfinished = S.info.unfinished;
  try {
    for (const c of await api().pending_checks()) S.queue.push({ path: c.path, name: baseName(c.path), status: "check", bundle: c.bundle, file: c.file });
  } catch (e) { /* none to check */ }
  if (S.info.required) S.update.blocking = true;
  S.multi = !!S.info.settings.multi;
  S.people = S.info.settings.people || 0;
  if (S.info.mode === "setup" || !S.info.configured) startSetup();
  go("make");
  requestAnimationFrame(() => api().page_ready());  // for startup.log
  if (S.pendingSrt) { app.openSrt(S.pendingSrt); S.pendingSrt = null; }
  if (S.update.blocking) return lockForUpdate();
  // Just updated: say what's new (once), unless the window was opened to set up or update
  if (S.info.news && S.info.news.length && !S.info.mode && S.info.configured)
    setTimeout(() => { if (!$("#dialog-root").innerHTML.trim()) showNews(S.info.news, true); }, 700);
  if (S.info.mode === "update") openUpdate();  // opened by Update.bat
  else if (S.info.mode === "uninstall") { go("settings"); ACTIONS.uninstall(); }  // Settings > Apps > Uninstall
  // Quietly, and a few seconds in so it doesn't slow the start: only a ready update is shown
  // Even with automatic checks off this looks, but then only speaks up for a security update
  else setTimeout(() => checkUpdate(true), 4000);
}
if (window.pywebview && window.pywebview.api) boot();
else window.addEventListener("pywebviewready", boot);
</script>
