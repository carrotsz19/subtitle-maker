# Makes a GitHub release with the installer attached, so people can download it straight from the
# release page. Either push a version tag (git tag v0.1.0 && git push origin v0.1.0), or run it from
# the Actions tab (Release > Run workflow) with a version name, and the tag is made on main.
# v0.x tags and tags with a dash (v1.2.0-beta.1) become pre-releases; others are full releases.
# The version needs a "## 0.3.0 · date" section in CHANGELOG.md: it goes at the top of the notes.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in v0.*|*-*) prerelease="--prerelease" ;; esac
          # What's new in this version, from its section in CHANGELOG.md (the app shows the same)
          version="${TAG#v}"; version="${version%%-*}"
          awk -v v="$version" '
            /^## / { on = ($2 == v || $2 == "v" v); next }
            on' CHANGELOG.md > changes.md
          if ! grep -q '^- ' changes.md; then
            echo "::error::CHANGELOG.md has no '## $version' section. Add what's new in $version there, then release again."
            exit 1
          fi
          { echo "## What's new in $version"; echo; cat changes.md; echo; } > notes.md
          cat >> notes.md <<'NOTES'
          **To install on a Windows PC** (no security warnings): open PowerShell or Terminal, paste this and press Enter:

          ```powershell
          irm https://raw.githubusercontent.com/carrotsz19/subtitle-maker/main/install.ps1 | iex
          ```

          Or download `Install.Subtitle.Maker.bat` below and double-click it. Your browser and Windows warn about
          downloaded .bat files: keep it, then click **More info**, **Run anyway**.

          Already installed? It updates itself: Settings > Updates in the window.
          NOTES
          # A pushed tag already exists; a run from the Actions tab makes it on the commit it ran on
          verify=""
          [ "${{ github.event_name }}" = "push" ] && verify="--verify-tag"
          gh release create "$TAG" $prerelease $verify --target "$GITHUB_SHA" --title "Subtitle Maker $TAG" \
            --notes-file notes.md --generate-notes "Install Subtitle Maker.bat"
