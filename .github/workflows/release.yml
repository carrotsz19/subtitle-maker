# Push a version tag (git tag v0.1.0 && git push origin v0.1.0) and this makes the GitHub release,
# with the installer attached so people can download it straight from the release page.
# v0.x tags and tags with a dash (v1.2.0-beta.1) become pre-releases; others are full releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in v0.*|*-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<'NOTES'
          **To install on a Windows PC:** download `Install.Subtitle.Maker.bat` below and double-click it.
          If Windows says "Windows protected your PC", click **More info**, then **Run anyway**.
          It installs the latest version, sets everything up and puts a shortcut on the desktop.

          Already installed? Use Settings > Updates in the window, or `Update.bat`.
          NOTES
          gh release create "$TAG" $prerelease --verify-tag --title "Subtitle Maker $TAG" \
            --notes-file notes.md --generate-notes "Install Subtitle Maker.bat"
